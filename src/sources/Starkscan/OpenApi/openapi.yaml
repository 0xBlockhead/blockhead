  /v1/{chain}/address/{address}/transfers:
    get:
      summary: Paginated token transfers touching one address
      description: Address-scoped transfer history backed by the indexed global transfer table. Direction, token, block, cursor, and limit filters are applied before pagination. `any` returns transfers where the address is either sender or recipient; self-transfers are returned once. `in` returns recipient-side rows and `out` returns sender-side rows, so a self-transfer appears in both directional views. Rows are newest-first by `(blockNumber, txIndex, logIndex, transferIndex)`; `nextCursor` is an exclusive continuation boundary and must be passed back unchanged.
      security:
        - StarkscanApiKey: []
      parameters:
        - $ref: "#/components/parameters/ChainParam"
        - name: address
          in: path
          required: true
          schema:
            type: string
          example: "0x0123456789abcdef"
        - name: direction
          in: query
          description: |
            Optional direction relative to the path address: `any`, `in`, or `out`.
          schema:
            type: string
            enum:
              - any
              - in
              - out
            default: any
        - name: token
          in: query
          description: Optional repeated token-address filter.
          schema:
            type: array
            maxItems: 128
            items:
              type: string
              pattern: ^0[xX][0-9a-fA-F]{1,64}$
          style: form
          explode: true
        - name: type
          in: query
          description: Indexed transfer-standard filter. Friendly aliases `fungible`, `ft`, `nft`, and `multitoken` are accepted.
          schema:
            type: string
            enum:
              - erc20
              - erc721
              - erc1155
              - unknown
              - fungible
              - ft
              - nft
              - multitoken
        - name: symbol
          in: query
          description: Exact case-insensitive indexed token-symbol filter. Ambiguous symbols matching more than 128 contracts fail closed.
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - name: timestampFrom
          in: query
          description: Inclusive lower timestamp resolved once through the indexed block-timestamp read model before transfer pagination.
          schema:
            oneOf:
              - type: string
                format: date-time
              - type: integer
                format: int64
        - name: invocationType
          in: query
          description: Case-insensitive indexed transaction-type filter for the transfer's transaction. Canonical values are `DECLARE`, `DEPLOY`, `DEPLOY_ACCOUNT`, `INVOKE`, and `L1_HANDLER`; Xverse aliases such as `execute` are normalized to `INVOKE`.
          schema:
            type: string
        - name: from_block
          in: query
          description: Optional inclusive lower block bound.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: to_block
          in: query
          description: Optional inclusive upper block bound.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: cursor
          in: query
          description: |
            Optional opaque continuation cursor returned by `nextCursor`. The current representation is `block:tx:log:transfer`; pass it back unchanged and do not construct or advance it client-side.
          schema:
            type: string
            pattern: ^[0-9]+:[0-9]+:[0-9]+:[0-9]+$
        - name: limit
          in: query
          description: Page size (clamped to 1..100).
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Address transfer page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlobalTransferPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/UnauthorizedText"
        "403":
          $ref: "#/components/responses/ForbiddenText"
        "410":
          $ref: "#/components/responses/HistoryExpired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-starkscan-audience: public-core
      x-starkscan-certification: beta
      x-starkscan-stability: stable
      x-starkscan-surface-tier: official-public-api
      x-starkscan-key-tier: read
      tags:
        - Addresses
