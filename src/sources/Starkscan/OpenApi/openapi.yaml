        fromBlock:
          type:
            - integer
            - "null"
          format: int64
        throughBlock:
          type:
            - integer
            - "null"
          format: int64
        sourceWatermarkBlock:
          type:
            - integer
            - "null"
          format: int64
        sourceWatermarkHash:
          type:
            - string
            - "null"
          pattern: ^0x[0-9a-fA-F]{1,64}$
    AddressIntelligenceItemView:
      oneOf:
