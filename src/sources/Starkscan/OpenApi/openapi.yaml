        - caveat
      properties:
        commitmentCount:
          type: integer
          format: int64
          minimum: 0
          description: Count of public commitment facts indexed for the pool.
        nullifierCount:
          type: integer
          format: int64
          minimum: 0
          description: Count of public nullifier facts indexed for the pool.
        openNoteCreatedCount:
          type: integer
          format: int64
          minimum: 0
        openNoteDepositedCount:
          type: integer
          format: int64
          minimum: 0
        encNoteCreatedCount:
          type: integer
          format: int64
          minimum: 0
        noteUsedCount:
          type: integer
          format: int64
          minimum: 0
        spentNoteProxyCount:
          type: integer
          format: int64
          minimum: 0
          description: Public spent-note proxy equal to the nullifier count; notes are not linked.
        unspentNoteProxyCount:
          type: integer
          format: int64
          minimum: 0
          description: Public unspent-note proxy computed as commitments minus nullifiers, floored at zero.
        source:
          type: string
          enum:
            - public_decoded_event_rows
        caveat:
          type: string
          const: Public note/nullifier proxy only; not exact anonymity k; exact anonymity requires root-time state and denomination semantics.
          description: Explicit caveat that this is not exact anonymity k.
    PrivacyPoolTvlAsOfView:
      type: object
      additionalProperties: false
      required:
        - blockNumber
        - blockHash
        - blockTimestamp
        - materializedAt
