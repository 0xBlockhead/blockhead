          description: Version of the bounded indexed evidence sources used by this response.
        items:
          type: array
          maxItems: 128
          items:
            $ref: "#/components/schemas/AddressIntelligenceItemView"
    ClassDirectoryItemView:
      type: object
      additionalProperties: false
      description: |
        Indexed class fact derived from its earliest canonical DECLARE or legacy DEPLOY origin with optional deployment, ABI/class, and verification enrichment. A legacy deployment origin is not a declaration. `classLabel` is a reviewed class family label, not exact source verification.
      required:
        - chainId
        - classHash
        - classLabel
        - classLabelSource
        - verificationTier
        - verificationSource
        - verificationProvider
        - verificationEvidenceDigest
        - verificationObservedAtIso
        - verificationClaimCount
        - originKind
        - originTransactionHash
        - originatedAtBlock
        - originatedAtIso
        - originSource
        - originFinalityStatus
        - originRefreshedAtIso
        - declarationTxHash
        - declaredAtBlock
        - declaredAtIso
        - compiledClassHash
        - classKind
        - classVersion
        - abiAvailable
        - abiSource
        - instanceCount
        - currentInstanceCount
        - accountInstanceCount
        - contractInstanceCount
        - unknownInstanceCount
        - verifiedInstanceCount
        - instanceCoverage
        - firstSeenBlockNumber
        - usageAsOfBlock
        - firstSeenAtIso
        - sampleContractAddress
        - source
        - usageRefreshedAtIso
        - refreshedAtIso
      properties:
        chainId:
          type: string
        classHash:
          type: string
          pattern: ^0[xX][0-9a-fA-F]{1,64}$
        classLabel:
          type:
            - string
            - "null"
          description: Human-readable class-family label when the class hash matches the reviewed official class registry.
        classLabelSource:
          type:
            - string
            - "null"
          enum:
            - official_class_registry
            - null
          description: Machine-readable provenance for `classLabel`; null when no class-family label is resolved.
        verificationTier:
          type: string
          enum:
            - verified_exact
            - verified_external
            - official_release
            - source_candidate
            - abi_declared
            - class_family
            - unverified
          description: |
            Class verification tier. Values are ordered by evidence strength for this materialized directory: `verified_exact` means Starkscan has an active successful immutable verification receipt whose produced canonical class hash matches this class under an accepted verifier policy; `verified_external` is reserved for trusted third-party verification; `official_release` is reserved for official project release metadata; `source_candidate` is reserved for unverified source-candidate evidence; `abi_declared` means indexed ABI/class metadata is available but source is not verified; `class_family` means the class hash belongs to a reviewed official class-family registry and is not exact source verification; `unverified` means no verification, ABI, or class-family evidence was materialized.
          x-enumDescriptions:
            verified_exact: An active successful immutable Starkscan verification receipt exactly matches this canonical class hash.
            verified_external: Reserved for trusted external verifier evidence.
            official_release: Reserved for official project release metadata.
            source_candidate: Reserved for unverified source-candidate evidence.
            abi_declared: Indexed ABI/class metadata exists, but source verification is not established.
            class_family: Reviewed official class-family registry match only; not exact source verification.
            unverified: No verification, ABI, or class-family evidence is materialized.
        verificationSource:
          type:
            - string
            - "null"
          description: Machine-readable source family for the verification claim. `receipt` identifies an active Starkscan exact receipt; `federated_external` identifies retained provider evidence.
        verificationProvider:
          type:
            - string
            - "null"
          description: Verification provider. `starkscan` identifies independently rebuilt exact receipt evidence; external values identify the observing provider and do not imply a Starkscan rebuild.
        verificationEvidenceDigest:
          type:
            - string
            - "null"
          description: Content digest for the active exact receipt candidate or immutable build evidence, or for the retained external claim, when available.
        verificationObservedAtIso:
          type:
            - string
            - "null"
          format: date-time
          description: Exact receipt completion time or external claim observation time, depending on `verificationSource`.
        verificationClaimCount:
          type:
            - integer
            - "null"
          format: int64
          minimum: 0
          description: Number of active exact receipts or retained external claims supporting this materialized tier.
        originKind:
          type:
            - string
            - "null"
          enum:
            - declare
            - legacy_deploy
            - null
          description: How the class first entered the indexed chain. Legacy deployment is explicitly not declaration proof.
        originTransactionHash:
          type:
            - string
            - "null"
          description: Transaction containing the canonical indexed class origin.
        originatedAtBlock:
          type:
            - integer
            - "null"
          format: int64
        originatedAtIso:
          type:
            - string
            - "null"
          format: date-time
        originSource:
          type:
            - string
            - "null"
          enum:
            - indexed_finalized_declare_tx
            - indexed_head_declare_tx
            - indexed_finalized_legacy_deploy_tx
            - indexed_head_legacy_deploy_tx
            - null
        originFinalityStatus:
          type:
            - string
            - "null"
          enum:
            - finalized
            - head
            - null
        originRefreshedAtIso:
          type:
            - string
            - "null"
          format: date-time
        declarationTxHash:
          type:
            - string
            - "null"
          description: Declaration transaction hash when indexed; null for legacy deployment-only or observation-only rows.
        declaredAtBlock:
          type:
            - integer
            - "null"
          format: int64
        declaredAtIso:
          type:
            - string
            - "null"
          format: date-time
        compiledClassHash:
          type:
            - string
            - "null"
          description: Compiled class hash when supplied by indexed declaration metadata.
        classKind:
          type:
            - string
            - "null"
          description: Indexed class kind when supplied by declaration metadata.
        classVersion:
          type:
            - string
            - "null"
          description: Cairo or class-version metadata when materialized.
        abiAvailable:
          type: boolean
        abiSource:
          type:
            - string
            - "null"
        instanceCount:
          type: integer
          format: int64
          minimum: 0
        currentInstanceCount:
          type: integer
          format: int64
          minimum: 0
          description: Computed count of indexed addresses with a current ABI/class observation for this class. This is not a current-class-hash guarantee.
        accountInstanceCount:
          type: integer
          format: int64
          minimum: 0
          description: Count of indexed instances with explicit account evidence.
        contractInstanceCount:
          type: integer
          format: int64
          minimum: 0
          description: Count of indexed instances with explicit non-account evidence.
        unknownInstanceCount:
          type: integer
          format: int64
          minimum: 0
          description: Count of indexed instances without authoritative account-or-contract kind evidence. instanceCount equals accountInstanceCount plus contractInstanceCount plus unknownInstanceCount.
        verifiedInstanceCount:
          type: integer
          format: int64
          minimum: 0
        instanceCoverage:
          $ref: "#/components/schemas/ClassInstanceCoverageView"
        firstSeenBlockNumber:
          type:
            - integer
            - "null"
          format: int64
          description: Earliest block from one paired indexed class-association evidence row; never derived from an unrelated address creation timestamp.
        usageAsOfBlock:
          type:
            - integer
            - "null"
          format: int64
          description: Highest indexed relationship-evidence block included in the materialized usage counts.
        firstSeenAtIso:
          type:
            - string
            - "null"
          format: date-time
          description: Timestamp from the same evidence row as firstSeenBlockNumber.
        sampleContractAddress:
          type:
            - string
            - "null"
          pattern: ^0[xX][0-9a-fA-F]{1,64}$
        source:
          type: string
          enum:
            - indexed_class_observation
            - indexed_finalized_declare_tx
            - indexed_head_declare_tx
            - indexed_finalized_legacy_deploy_tx
            - indexed_head_legacy_deploy_tx
          description: Evidence backing this row. Origin sources do not imply source-code verification.
        usageRefreshedAtIso:
          type:
            - string
            - "null"
          format: date-time
          description: Last refresh of usage counts and instance enrichment, separate from origin provenance freshness.
        refreshedAtIso:
          type: string
          format: date-time
    ClassInstanceCoverageView:
      type: object
      additionalProperties: false
      description: |
        Scope and classification evidence for class instance counts. Class counts are indexed observations, not a chain-wide census; consumers must not infer omitted instances from a numeric count.
      required:
        - coverageStatus
        - reasonCode
        - observedFromBlock
        - observedThroughBlock
        - classificationCoverage
        - isLowerBound
        - isExhaustive
      properties:
        coverageStatus:
          type: string
          enum:
            - partial
            - unavailable
          description: "`partial` means the usage projection produced a bounded indexed-observation window; `unavailable` means no trustworthy usage watermark exists."
        reasonCode:
          type: string
          enum:
            - indexed_observation_window
            - usage_projection_unavailable
        observedFromBlock:
          type:
            - integer
            - "null"
          format: int64
          minimum: 0
          description: Inclusive earliest materialized class-association evidence block, not necessarily the class's first chain occurrence.
        observedThroughBlock:
          type:
            - integer
            - "null"
          format: int64
          minimum: 0
          description: Inclusive usage-projection watermark for the materialized observation window.
        classificationCoverage:
          type: string
          enum:
            - partial
            - known_for_observed_instances
            - unavailable
          description: "`known_for_observed_instances` applies only to materialized rows; it is not a claim of chain-wide account-or-contract classification."
        isLowerBound:
          type: boolean
          description: True only when an observation window exists and the numeric counts can safely be treated as lower bounds.
        isExhaustive:
          type: boolean
          enum:
            - false
          description: Always false for the indexed-observation directory; it is not a global class-instance census.
      oneOf:
        - title: Bounded indexed-observation window
          properties:
            coverageStatus:
              const: partial
            reasonCode:
              const: indexed_observation_window
            observedFromBlock:
              type: integer
            observedThroughBlock:
              type: integer
            classificationCoverage:
              enum:
                - partial
                - known_for_observed_instances
            isLowerBound:
              const: true
        - title: No trustworthy usage watermark
          properties:
            coverageStatus:
              const: unavailable
            reasonCode:
              const: usage_projection_unavailable
            observedFromBlock:
              type: "null"
            observedThroughBlock:
              type: "null"
            classificationCoverage:
              const: unavailable
            isLowerBound:
              const: false
    ClassDirectoryPageView:
      type: object
      additionalProperties: false
      required:
        - items
        - nextCursor
        - source
        - catalogTotal
        - usageCohortTotal
        - catalogAsOfBlock
        - originSetDigest
        - originRefreshedAtIso
        - usageAsOfBlock
        - latestRelationshipEvidenceBlock
        - usageRefreshedAtIso
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/ClassDirectoryItemView"
        nextCursor:
          type:
            - string
            - "null"
          pattern: ^c(?:1:[0-9]+:0[xX][0-9a-fA-F]{1,64}|2:[0-9]+:[0-9]+:0[xX][0-9a-fA-F]{1,64})$
        source:
          type: string
          enum:
            - indexed_class_observation
            - indexed_class_origin
        catalogTotal:
          type:
            - integer
            - "null"
          format: int64
          minimum: 0
          description: Total materialized canonical class origins for this chain, independent of the loaded page or filters.
        usageCohortTotal:
          type:
            - integer
            - "null"
          format: int64
          minimum: 0
          description: Number of classes with materialized usage relationships. The instances_desc page is bounded to this cohort; it is separate from catalogTotal.
        catalogAsOfBlock:
          type:
            - integer
            - "null"
          format: int64
          minimum: 0
          description: Highest contiguous indexed block reconciled into the canonical class-origin catalog, beginning at block 0. Null means contiguous historical certification has not yet been established.
        originSetDigest:
          type:
            - string
            - "null"
          pattern: ^sha256:[0-9a-f]{64}$
          description: Deterministic digest of the sorted canonical class-hash set for reconciliation evidence.
        originRefreshedAtIso:
          type:
            - string
            - "null"
          format: date-time
          description: Last successful canonical class-origin materialization time.
        usageAsOfBlock:
          type:
            - integer
            - "null"
          format: int64
          minimum: 0
