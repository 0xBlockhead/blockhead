    PrivacyPoolAnalyticsView:
      type: object
      additionalProperties: false
      required:
        - chainId
        - totalEvents
        - uniqueTransactionCount
        - contractCount
        - latestEventBlock
        - eventBreakdown
        - visibilityBreakdown
        - tokenFlows
        - tokenFlowsLimit
        - tokenFlowsTruncated
        - tokenFlowSourceEventLimit
        - tokenFlowSourceEventsTruncated
        - missingAmountEventCount
        - strkbtcObserved
        - unknownTokenCount
        - privateActivity
        - unavailableMetrics
      properties:
        chainId:
          type: string
        totalEvents:
          type: integer
          format: int64
        uniqueTransactionCount:
          type: integer
          format: int64
        contractCount:
          type: integer
          format: int64
        latestEventBlock:
          type:
            - integer
            - "null"
          format: int64
        eventBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/PrivacyPoolCountView"
        visibilityBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/PrivacyPoolCountView"
        tokenFlows:
          type: array
          items:
            $ref: "#/components/schemas/PrivacyPoolTokenFlowView"
        tokenFlowsLimit:
          type: integer
          format: int64
        tokenFlowsTruncated:
          type: boolean
        tokenFlowSourceEventLimit:
          type: integer
          format: int64
          description: |
            Source event window used to derive tokenFlows. A value of 0 means the route is using all-history indexed public token-flow facts instead of deriving metrics from a bounded recent event sample.
        tokenFlowSourceEventsTruncated:
          type: boolean
          description: |
            True when tokenFlows were derived from a clipped source event window. False for all-history fact-backed token-flow metrics.
        missingAmountEventCount:
          type: integer
          format: int64
        strkbtcObserved:
          type: boolean
        unknownTokenCount:
          type: integer
          format: int64
        privateActivity:
