          schema:
            type: string
            enum:
              - 30d
              - 90d
              - ytd
              - all
            default: 30d
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Prepared finalized Starknet network metric series with explicit materializer coverage status.
