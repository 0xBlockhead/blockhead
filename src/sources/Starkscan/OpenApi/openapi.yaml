            - "null"
        priceConfidence:
          type:
            - string
            - "null"
          enum:
            - exact
            - proxy
            - null
        priceTimestampIso:
          type:
            - string
            - "null"
          format: date-time
        priceObservedAtIso:
          type:
            - string
            - "null"
          format: date-time
    AddressTokenHoldingUsdView:
