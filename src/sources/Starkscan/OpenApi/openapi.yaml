        - totalPrivateActionTxCount
        - totalHelperWithdrawalEventCount
        - totalNoteUsedEventCount
        - totalOpenNoteDepositedEventCount
        - metricsLimit
        - metricsTruncated
        - metrics
      properties:
        source:
          type: string
        coverageStatus:
          type: string
          description: Only `complete` permits clients to treat the returned counters as lifetime totals. `stale` and `unavailable` fail closed and return no lifetime counter.
          enum:
            - complete
            - stale
            - unavailable
        coverageReasonCode:
          type:
            - string
            - "null"
          description: Stable reason lifetime coverage is not complete. `source_coverage_stale` means a sealed source exists but finalized source facts extend beyond it. `historical_materialization_not_reconciled` means older finalized routes have not been reconciled into the serving aggregate. `private_activity_metrics_not_migrated` means the serving migration is not available.
          enum:
            - historical_materialization_not_reconciled
            - source_coverage_stale
            - private_activity_metrics_not_migrated
            - null
        sourceProvenance:
          oneOf:
            - $ref: "#/components/schemas/PrivacyPoolPrivateActivitySourceProvenanceView"
            - type: "null"
        caveat:
          type: string
        totalPrivateActionTxCount:
          type:
            - integer
            - "null"
          format: int64
        totalHelperWithdrawalEventCount:
          type:
            - integer
            - "null"
          format: int64
        totalNoteUsedEventCount:
          type:
            - integer
            - "null"
          format: int64
        totalOpenNoteDepositedEventCount:
          type:
            - integer
            - "null"
          format: int64
        metricsLimit:
          type: integer
          format: int64
        metricsTruncated:
          type: boolean
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/PrivacyPoolPrivateActivityMetricView"
      oneOf:
        - properties:
            coverageStatus:
              const: complete
            coverageReasonCode:
              const: null
            sourceProvenance:
              $ref: "#/components/schemas/PrivacyPoolPrivateActivitySourceProvenanceView"
            totalPrivateActionTxCount:
              type: integer
              format: int64
            totalHelperWithdrawalEventCount:
              type: integer
              format: int64
            totalNoteUsedEventCount:
              type: integer
              format: int64
            totalOpenNoteDepositedEventCount:
              type: integer
              format: int64
            metrics:
              type: array
              items:
                allOf:
                  - $ref: "#/components/schemas/PrivacyPoolPrivateActivityMetricView"
                  - type: object
                    properties:
                      confidence:
                        const: certified
                    required:
                      - confidence
          required:
            - coverageStatus
            - coverageReasonCode
            - sourceProvenance
        - properties:
            coverageStatus:
              const: stale
            coverageReasonCode:
              const: source_coverage_stale
            sourceProvenance:
              $ref: "#/components/schemas/PrivacyPoolPrivateActivitySourceProvenanceView"
            totalPrivateActionTxCount:
              const: null
            totalHelperWithdrawalEventCount:
              const: null
            totalNoteUsedEventCount:
              const: null
            totalOpenNoteDepositedEventCount:
              const: null
            metrics:
              maxItems: 0
            metricsTruncated:
              const: false
          required:
            - coverageStatus
            - coverageReasonCode
            - sourceProvenance
        - properties:
            coverageStatus:
              const: unavailable
            coverageReasonCode:
              const: historical_materialization_not_reconciled
            sourceProvenance:
              const: null
            totalPrivateActionTxCount:
              const: null
            totalHelperWithdrawalEventCount:
              const: null
            totalNoteUsedEventCount:
              const: null
            totalOpenNoteDepositedEventCount:
              const: null
            metrics:
              maxItems: 0
            metricsTruncated:
              const: false
          required:
            - coverageStatus
            - coverageReasonCode
            - sourceProvenance
        - properties:
            coverageStatus:
              const: unavailable
            coverageReasonCode:
