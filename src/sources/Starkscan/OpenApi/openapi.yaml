              type: string
              const: trace_certified
            evidenceSource:
              type: string
              const: state_update_and_transaction_trace
            transactionHash:
              type: string
              pattern: ^0x[0-9a-fA-F]{1,64}$
            deploymentKind:
              type: string
              const: invoke_factory
            originAddress:
              type: string
              pattern: ^0x[0-9a-fA-F]{1,64}$
            factoryAddress:
              type: string
              pattern: ^0x[0-9a-fA-F]{1,64}$
        - properties:
