        decodedFieldsUnavailableReason:
          type:
            - string
            - "null"
          enum:
            - schema_unavailable
            - selector_only_attribution
            - payload_shape_mismatch
            - schema_shape_unsupported
            - null
    TransactionTransferView:
      type: object
      additionalProperties: false
      required:
        - logIndex
        - transferIndex
        - tokenAddress
        - fromAddress
        - toAddress
        - amount
        - tokenId
        - standard
        - historicalUsd
      properties:
        logIndex:
          type: integer
          format: int32
        transferIndex:
          type: integer
          format: int32
        tokenAddress:
          type: string
        fromAddress:
          type:
            - string
            - "null"
        toAddress:
          type:
            - string
            - "null"
        amount:
          type:
            - string
            - "null"
        tokenId:
          type:
            - string
            - "null"
        standard:
          type: string
        historicalUsd:
          description: |
            Transaction-time USD coverage when this route includes price materialization. Transaction-detail and token-transfer responses report a priced, typed-unpriced, or pending result. `outside_history_window` is terminal provider-policy coverage; `price_missing` is a repairable in-horizon gap. Lightweight preview/list responses that intentionally omit this enrichment may return null. Never treat a null or unpriced result as a live/current market price.
          oneOf:
            - $ref: "#/components/schemas/TokenTransferHistoricalUsd"
            - type: "null"
    TokenTransferHistoricalUsd:
      type: object
      description: |
        Historical-USD coverage for one transfer. This is exactly one of: a priced transaction-time valuation; a typed unpriced result; or a pending materialization result. Clients must branch on `coverageStatus` and `coverageReasonCode`; null price fields are never a request to substitute a current/spot price.
      additionalProperties: false
      required:
        - amountDecimal
        - priceUsd
        - valueUsd
        - priceHourIso
        - priceSourceTimestampIso
        - priceSource
        - provider
        - providerAssetId
        - quoteCurrency
        - coverageStatus
        - coverageReasonCode
        - indexedAt
      properties:
        amountDecimal:
          type:
            - string
            - "null"
        priceUsd:
          description: Token unit price in USD for `priceHourIso`, not current spot price.
          type:
            - string
            - "null"
        valueUsd:
          description: Transfer USD value at `priceHourIso`, not current spot value.
          type:
            - string
            - "null"
        priceHourIso:
          type:
            - string
            - "null"
          format: date-time
        priceSourceTimestampIso:
          description: Timestamp of the provider observation used for this historical price.
          type:
            - string
            - "null"
          format: date-time
        priceSource:
          type:
            - string
            - "null"
        provider:
          type:
            - string
            - "null"
        providerAssetId:
          type:
            - string
            - "null"
        quoteCurrency:
          type: string
        coverageStatus:
          type: string
          enum:
            - priced
            - unpriced
            - pending
        coverageReasonCode:
          type: string
          enum:
            - priced
            - causal_hourly_price
            - token_unmapped
            - metadata_missing
            - non_fungible
            - amount_missing
            - price_missing
            - provider_granularity_daily
            - outside_history_window
            - materialization_pending
        indexedAt:
          type:
            - string
            - "null"
          format: date-time
      oneOf:
        - title: Priced transaction-time valuation
          properties:
            coverageStatus:
              const: priced
            coverageReasonCode:
              enum:
                - priced
                - causal_hourly_price
        - title: Typed unpriced result
          properties:
            coverageStatus:
              const: unpriced
            coverageReasonCode:
              enum:
                - token_unmapped
                - metadata_missing
                - non_fungible
                - amount_missing
                - price_missing
                - provider_granularity_daily
                - outside_history_window
        - title: Eligible transfer awaiting materialization
          properties:
            coverageStatus:
              const: pending
            coverageReasonCode:
              const: materialization_pending
    TokenTransferUsdCoverageSnapshot:
      type: object
      description: |
        One offline-prepared snapshot over the provider's bounded trailing history window. This is coverage telemetry, not a price feed. A transaction-time USD value is authoritative only when its individual transfer fact has `coverageStatus=priced`. Eligible and covered block/timestamp bounds are each either fully null or fully present; covered bounds always stay inside the eligible window.
      additionalProperties: false
      required:
        - chainId
        - provider
        - quoteCurrency
        - maxHistoryDays
        - sourcePolicy
        - eligibleFromBlock
        - eligibleToBlock
        - eligibleFromTimestamp
        - eligibleToTimestamp
        - coveredFromBlock
        - coveredThroughBlock
        - coveredFromTimestamp
        - coveredThroughTimestamp
        - pricedTransfers
        - typedUnavailableTransfers
        - pendingMaterializationTransfers
        - typedUnavailableByReason
        - latestSuccessfulRunAt
        - measuredAt
        - nextMaterializerDirection
        - compactQuoteAssetsExpected
        - compactQuoteAssetsComplete
        - compactQuoteAssetsIncomplete
        - compactQuoteCoveredFromTimestamp
        - compactQuoteCoveredThroughTimestamp
        - exact
        - scope
        - status
      properties:
        chainId:
          type: string
        provider:
          type: string
        quoteCurrency:
          type: string
        maxHistoryDays:
          type: integer
          format: int32
          minimum: 1
          maximum: 365
        sourcePolicy:
          type: string
          const: hourly_causal_no_forward_fill
        eligibleFromBlock:
          type:
            - integer
            - "null"
          format: int64
          minimum: 0
        eligibleToBlock:
          type:
            - integer
            - "null"
          format: int64
          minimum: 0
        eligibleFromTimestamp:
          type:
            - string
            - "null"
          format: date-time
        eligibleToTimestamp:
          type:
            - string
            - "null"
          format: date-time
        coveredFromBlock:
          type:
            - integer
            - "null"
          format: int64
          minimum: 0
        coveredThroughBlock:
          type:
            - integer
            - "null"
          format: int64
          minimum: 0
        coveredFromTimestamp:
          type:
            - string
            - "null"
          format: date-time
        coveredThroughTimestamp:
          type:
            - string
            - "null"
          format: date-time
        pricedTransfers:
          type: integer
          format: int64
          minimum: 0
        typedUnavailableTransfers:
          type: integer
          format: int64
          minimum: 0
        pendingMaterializationTransfers:
          type: integer
          format: int64
          minimum: 0
        typedUnavailableByReason:
          type: object
          additionalProperties: false
          properties:
            token_unmapped:
              type: integer
              format: int64
              minimum: 0
            metadata_missing:
              type: integer
              format: int64
              minimum: 0
            non_fungible:
              type: integer
              format: int64
              minimum: 0
            amount_missing:
              type: integer
              format: int64
              minimum: 0
            price_missing:
              type: integer
              format: int64
              minimum: 0
            provider_granularity_daily:
              type: integer
              format: int64
              minimum: 0
          description: |
            Materialized unpriced outcomes by reason. `provider_granularity_daily` is deliberately unpriced and must not be included in `pricedTransfers`.
        latestSuccessfulRunAt:
          type:
            - string
            - "null"
          format: date-time
        measuredAt:
          type: string
          format: date-time
        nextMaterializerDirection:
          type:
            - string
            - "null"
          enum:
            - forward
            - backfill
            - null
        compactQuoteAssetsExpected:
          type: integer
          format: int64
          minimum: 0
          description: Reviewed direct-price assets enrolled for compact hourly history.
        compactQuoteAssetsComplete:
          type: integer
          format: int64
          minimum: 0
          description: Enrolled assets whose bounded 365-day hourly recovery cursor is complete.
        compactQuoteAssetsIncomplete:
          type: integer
          format: int64
          minimum: 0
          description: Enrolled assets still advancing through bounded hourly recovery.
        compactQuoteCoveredFromTimestamp:
          type:
            - string
            - "null"
          format: date-time
          description: Common factual hourly-quote floor when every enrolled asset has quote rows.
        compactQuoteCoveredThroughTimestamp:
          type:
            - string
            - "null"
          format: date-time
          description: Common factual hourly-quote ceiling when every enrolled asset has quote rows.
        exact:
          type: boolean
          const: true
        scope:
          type: string
          const: eligible_finalized_transfers_in_bounded_provider_history_window
        status:
          type: string
          enum:
            - current
            - catching_up
            - stale
            - degraded
