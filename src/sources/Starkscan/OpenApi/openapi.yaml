      description: Starknet JSON-RPC 2.0 result or error envelope.
      required:
        - jsonrpc
        - id
      oneOf:
        - required:
            - result
          not:
            required:
              - error
        - required:
            - error
          not:
            required:
              - result
      additionalProperties: true
      properties:
        jsonrpc:
          type: string
          enum:
            - "2.0"
        id:
          oneOf:
            - type: string
            - type: integer
            - type: "null"
        result: {}
        error:
          $ref: "#/components/schemas/JsonRpcError"
