            type: string
            format: http-date
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Bounded finalized Privacy Pool hourly history page
          headers:
            ETag:
              description: Weak SHA-256 validator over the exact uncompressed JSON response bytes.
              schema:
                type: string
