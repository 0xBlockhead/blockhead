          type: string
        snapshot:
          $ref: "#/components/schemas/TokenHolderScreeningSnapshot"
        screening:
          $ref: "#/components/schemas/TokenHolderScreeningCoverage"
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/TokenHolderItem"
        nextCursor:
          type:
            - string
            - "null"
          description: Opaque continuation for this projection. Null proves only projection exhaustion.
        limits:
          $ref: "#/components/schemas/TokenHolderLimits"
    TokenHolderPage:
      type: object
      description: |
        One balance-ranked page from a token holder population. A complete immutable walk follows `nextCursor` to null while preserving the full snapshot identity, contiguous ranks, and stable count/total. Exactness is certification metadata and is independent of page coverage.
      additionalProperties: false
      required:
        - chainId
        - tokenAddress
        - snapshot
        - holderCount
        - holderBalanceTotalRaw
        - items
        - nextCursor
        - completeness
        - certification
        - limits
      properties:
        chainId:
          type: string
        tokenAddress:
          type: string
        snapshot:
          $ref: "#/components/schemas/TokenHolderSnapshot"
        holderCount:
          type: integer
          format: int64
          minimum: 0
          description: |
            Exact number of positive-balance rows in the immutable generation. When a non-serving certification state redacts public rows, zero is a redaction value and not proof that the token has no holders. A redacted response has `holderBalanceTotalRaw=null`; use that signal and the accompanying `certification.status`/`reasonCode` before treating zero as an empty population.
        holderBalanceTotalRaw:
          type:
            - string
            - "null"
          description: Snapshot-aligned sum of every positive holder balance used as the analytics denominator. Null when holder rows are redacted.
        items:
          type: array
          maxItems: 100
          description: Page rows ordered by balanceRaw descending and canonical holder address ascending, with one-based contiguous generation ranks.
          items:
            $ref: "#/components/schemas/TokenHolderItem"
        nextCursor:
          type:
            - string
            - "null"
          description: |
            Opaque immutable-generation v3 cursor for the next holder page. Non-null means more rows are available. Pass it back unchanged before `snapshot.expiresAt`; never decode, construct, or reuse it for another chain or token.
        completeness:
          $ref: "#/components/schemas/TokenHolderCompleteness"
        certification:
          $ref: "#/components/schemas/TokenHolderCertification"
        limits:
          $ref: "#/components/schemas/TokenHolderLimits"
