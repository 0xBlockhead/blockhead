          type:
            - integer
            - "null"
          format: int64
          minimum: 0
          description: |
            Latest indexed canonical Ethereum block associated with this message hash. For L1-to-L2 messages where l1SentCount > 1, this is the latest indexed L1 send block. Null when the relevant L1 origin or consumption fact has not been indexed.
        l1Fee:
          type:
            - string
            - "null"
          pattern: ^0[xX][0-9a-fA-F]{1,64}$
          description: |
            Canonical StarknetCore LogMessageToL2 fee for L1-to-L2 origins, encoded as a hex quantity when indexed. When l1SentCount > 1, this is the fee from the latest indexed L1 send, the same send reflected by l1BlockNumber. Null for L2-to-L1 messages or when no L1 origin has been indexed.
