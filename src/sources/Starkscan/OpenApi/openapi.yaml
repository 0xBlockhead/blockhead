        txCount:
          type: integer
          format: int64
        noteUsedEventCount:
          type: integer
          format: int64
        openNoteCreatedEventCount:
          type: integer
          format: int64
        openNoteDepositedEventCount:
          type: integer
          format: int64
        encNoteCreatedEventCount:
          type: integer
          format: int64
        helperWithdrawalEventCount:
          type: integer
          format: int64
        latestBlockNumber:
          type:
            - integer
            - "null"
          format: int64
        latestTxHash:
          type:
            - string
            - "null"
    PrivacyPoolPrivateActivityView:
      type: object
      additionalProperties: false
      required:
        - source
        - caveat
        - totalPrivateActionTxCount
        - totalHelperWithdrawalEventCount
        - totalNoteUsedEventCount
        - totalOpenNoteDepositedEventCount
        - metricsLimit
        - metricsTruncated
        - metrics
      properties:
        source:
          type: string
        caveat:
          type: string
        totalPrivateActionTxCount:
          type: integer
          format: int64
        totalHelperWithdrawalEventCount:
          type: integer
          format: int64
        totalNoteUsedEventCount:
          type: integer
          format: int64
        totalOpenNoteDepositedEventCount:
          type: integer
          format: int64
        metricsLimit:
          type: integer
          format: int64
        metricsTruncated:
          type: boolean
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/PrivacyPoolPrivateActivityMetricView"
    PrivacyPoolAnalyticsView:
      type: object
      additionalProperties: false
      required:
        - chainId
        - totalEvents
        - uniqueTransactionCount
        - contractCount
        - latestEventBlock
        - eventBreakdown
        - visibilityBreakdown
        - tokenFlows
        - tokenFlowsLimit
        - tokenFlowsTruncated
        - tokenFlowSourceEventLimit
        - tokenFlowSourceEventsTruncated
        - missingAmountEventCount
        - strkbtcObserved
        - unknownTokenCount
        - privateActivity
        - unavailableMetrics
      properties:
        chainId:
          type: string
        totalEvents:
          type: integer
          format: int64
        uniqueTransactionCount:
          type: integer
          format: int64
        contractCount:
          type: integer
          format: int64
        latestEventBlock:
          type:
            - integer
            - "null"
          format: int64
        eventBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/PrivacyPoolCountView"
        visibilityBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/PrivacyPoolCountView"
        tokenFlows:
          type: array
          items:
            $ref: "#/components/schemas/PrivacyPoolTokenFlowView"
        tokenFlowsLimit:
          type: integer
          format: int64
        tokenFlowsTruncated:
          type: boolean
        tokenFlowSourceEventLimit:
          type: integer
          format: int64
          description: |
            Source event window used to derive tokenFlows. A value of 0 means the route is using all-history indexed public token-flow facts instead of deriving metrics from a bounded recent event sample.
        tokenFlowSourceEventsTruncated:
          type: boolean
          description: |
            True when tokenFlows were derived from a clipped source event window. False for all-history fact-backed token-flow metrics.
        missingAmountEventCount:
          type: integer
          format: int64
        strkbtcObserved:
          type: boolean
        unknownTokenCount:
          type: integer
          format: int64
        privateActivity:
          $ref: "#/components/schemas/PrivacyPoolPrivateActivityView"
        unavailableMetrics:
          type: array
          items:
            $ref: "#/components/schemas/PrivacyPoolUnavailableMetricView"
    SearchBlockItem:
      type: object
      additionalProperties: false
      required:
        - blockNumber
        - blockHash
      properties:
        blockNumber:
          type: integer
          format: int64
        blockHash:
          type: string
    SearchTransactionItem:
      type: object
      additionalProperties: false
      required:
        - txHash
        - blockNumber
        - txIndex
      properties:
        txHash:
          type: string
        blockNumber:
          type: integer
          format: int64
        txIndex:
          type: integer
          format: int32
    SearchView:
      type: object
      additionalProperties: false
      required:
        - blocks
        - transactions
        - addresses
      properties:
        blocks:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/SearchBlockItem"
        transactions:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/SearchTransactionItem"
        addresses:
          type: array
          maxItems: 10
          items:
            type: string
  headers:
    RequestId:
      description: Canonical request correlation header for support and tracing.
      schema:
        type: string
    WwwAuthenticate:
      description: Authentication or scope hint when the request is rejected.
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before retrying this route class.
      schema:
        type: integer
        format: int64
    StarkscanRouteClass:
      description: Route budget class for class-specific backoff.
      schema:
        type: string
        enum:
          - light
          - list
          - heavy
          - profile
          - batch
    RateLimitLimit:
      description: Maximum request budget for the current route-class window.
      schema:
        type: integer
        format: int64
    RateLimitRemaining:
      description: Remaining request budget for the current route-class window.
      schema:
        type: integer
        format: int64
    RateLimitPolicy:
      description: Opaque rate-limit policy identifier for the current route class.
      schema:
        type: string
x-starkscan-audience: public-core
tags:
  - name: Account
    description: Session-authenticated self-serve API-key lifecycle and usage routes for workspace operators.
  - name: Addresses
  - name: Blocks
  - name: Contracts
  - name: Reference
    description: Low-level explorer read surfaces that stay public but sit outside the default block/transaction/address entrypoints.
  - name: Search
  - name: Status
  - name: Tokens
  - name: Transactions
  - name: Utilities
    description: Supported helper routes that remain external, but are not the default public API starting point and can require broader utility-access keys.
