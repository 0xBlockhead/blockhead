        deployedByAddress:
          type:
            - string
            - "null"
          description: Indexed deployer/factory address when authoritative deployment attribution exists.
        hasReceivedFunds:
          type: boolean
          description: True when indexed token-transfer rows show the address as recipient.
        latestActivityBlock:
