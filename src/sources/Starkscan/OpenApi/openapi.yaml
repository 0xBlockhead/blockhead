      x-starkscan-stability: stable
      x-starkscan-surface-tier: self-serve
      x-starkscan-key-tier: session
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      tags:
        - Account
  /v1/me/api-keys/{public_id}:
    delete:
      summary: Revoke one self-serve API key for the authenticated workspace
      description: "Revokes the selected self-serve API key and returns its final metadata snapshot. This mutating route requires `Authorization: Bearer <better_auth_session_token>` and rejects cookie-only calls."
      security:
        - SelfServeSession: []
      parameters:
        - name: public_id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Revoked self-serve API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelfServeApiKeyDeleteResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedSelfServeSession"
        "403":
          $ref: "#/components/responses/ForbiddenSelfServeMutation"
        "404":
          description: Self-serve API key not found
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-starkscan-audience: public-core
      x-starkscan-certification: beta
      x-starkscan-stability: stable
      x-starkscan-surface-tier: self-serve
      x-starkscan-key-tier: session
      tags:
        - Account
  /v1/me/usage:
    get:
      summary: Load recent self-serve API usage for the authenticated workspace
      description: Returns a recent usage window, per-key aggregates, recent requests, and recent failures for the current self-serve workspace. Hosted browser sessions may authenticate this safe read with Better Auth cookies or an explicit bearer session token.
      security:
        - SelfServeSession: []
        - SelfServeSessionCookie: []
        - SelfServeSessionCookieSecure: []
      responses:
        "200":
          description: Self-serve usage snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelfServeUsageSnapshot"
        "401":
          $ref: "#/components/responses/UnauthorizedSelfServeSession"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-starkscan-audience: public-core
      x-starkscan-certification: beta
      x-starkscan-stability: stable
      x-starkscan-surface-tier: self-serve
      x-starkscan-key-tier: session
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      tags:
        - Account
  /v1/{chain}/search:
    get:
      summary: Universal search
      security:
        - StarkscanApiKey: []
      parameters:
        - $ref: "#/components/parameters/ChainParam"
        - name: q
          in: query
          required: true
          description: |
            Required exact or prefix query. Missing or empty values return 400. Exact hash/address-style queries resolve first match in this order: transaction hash -> address -> block hash (single category returned). Prefix address matching reads address-activity tables only; addresses that appear exclusively in token-transfer activity remain accessible via `/v1/{chain}/address/{address}` but are not returned by `/search`.
          schema:
            type: string
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchView"
        "401":
          $ref: "#/components/responses/UnauthorizedText"
        "403":
          $ref: "#/components/responses/ForbiddenText"
        "410":
          $ref: "#/components/responses/HistoryExpired"
        "429":
          $ref: "#/components/responses/RateLimited"
      x-starkscan-audience: public-core
      x-starkscan-certification: beta
      x-starkscan-stability: stable
      x-starkscan-surface-tier: official-public-api
      x-starkscan-key-tier: read
      tags:
        - Search
components:
  securitySchemes:
    StarkscanApiKey:
      type: apiKey
      in: header
      name: X-Starkscan-Api-Key
      description: External Starkscan API key header. Required access tier and scope are defined per operation.
    SelfServeSession:
      type: http
      scheme: bearer
      bearerFormat: Better Auth session token
      description: Session token for authenticated self-serve workspace routes. Hosted browser safe reads can also use Better Auth session cookies, but mutating /v1/me/* routes require an explicit bearer token.
    SelfServeSessionCookie:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: Better Auth session cookie accepted for hosted same-origin safe reads on /v1/me/*.
    SelfServeSessionCookieSecure:
      type: apiKey
      in: cookie
      name: __Secure-better-auth.session_token
      description: Secure Better Auth session cookie accepted for hosted same-origin safe reads on /v1/me/*.
  parameters:
    ChainParam:
      name: chain
      in: path
      required: true
      schema:
        type: string
      example: SN_MAIN
    RequestIdHeader:
      name: X-Request-Id
      in: header
      required: false
      description: Optional caller-supplied correlation ID echoed back in the response.
      schema:
        type: string
  responses:
    UnauthorizedText:
      description: Missing or invalid Starkscan credential.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        WWW-Authenticate:
          $ref: "#/components/headers/WwwAuthenticate"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnauthorizedSelfServeSession:
      description: Missing, invalid, or expired self-serve session.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        WWW-Authenticate:
          $ref: "#/components/headers/WwwAuthenticate"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Rate limit hit for the current route class.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
        X-Starkscan-Route-Class:
          $ref: "#/components/headers/StarkscanRouteClass"
        x-ratelimit-limit:
          $ref: "#/components/headers/RateLimitLimit"
        x-ratelimit-remaining:
          $ref: "#/components/headers/RateLimitRemaining"
        x-ratelimit-policy:
          $ref: "#/components/headers/RateLimitPolicy"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    HistoryExpired:
      description: |
        The request explicitly targets Sepolia indexed history below the published rolling-history floor. Current state and preserved lifecycle facts remain available; advance to `oldestAvailableBlock` or begin a new cursor traversal.
      headers:
        X-Request-Id:
          description: Canonical request correlation header for support and tracing.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HistoryExpiredErrorResponse"
    ServiceUnavailable:
      description: The route is temporarily unavailable.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    IndexingFreshnessDegraded:
      description: Indexing is stale or required freshness evidence is unavailable or inconsistent.
      headers:
        X-Request-Id:
          description: Canonical request correlation header for support and tracing.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IndexingFreshnessHealthView"
    BadRequest:
      description: Invalid request shape, path parameter, query parameter, or body.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ForbiddenText:
      description: Valid Starkscan credential lacks the required scope.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        WWW-Authenticate:
          $ref: "#/components/headers/WwwAuthenticate"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ForbiddenSelfServeMutation:
      description: Cookie-authenticated mutations are not allowed on self-serve routes.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        WWW-Authenticate:
          $ref: "#/components/headers/WwwAuthenticate"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The requested route or resource was not found.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The request conflicts with the current resource state.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    BlockReference:
      oneOf:
        - type: string
          enum:
            - latest
            - pending
        - type: string
          pattern: ^[0-9]+$
          maxLength: 19
          description: Decimal block number. Must be non-negative and fit in signed 64-bit range.
        - type: string
          pattern: ^0[xX][0-9a-fA-F]{1,128}$
          maxLength: 130
          description: 0x-prefixed Starknet block hash/felt.
      description: State reference. Block hashes are validated against the Starknet field range; decimal block numbers must be non-negative signed 64-bit values.
    ErrorResponse:
      type: object
      description: |
        Machine-readable error envelope. JSON error responses also emit `X-Request-Id` as the canonical correlation header when the request has one; `requestId` mirrors it when available inside the handler.
      additionalProperties: false
      required:
        - code
        - message
        - docSlug
        - requestId
      properties:
        code:
          type: string
          enum:
            - invalid_request
            - unauthorized
            - forbidden
            - not_found
            - conflict
            - rate_limited
            - service_unavailable
            - internal_error
            - api_error
        message:
          type: string
        docSlug:
          type: string
          description: Stable docs slug agents can use for next-step guidance.
        requestId:
          type:
            - string
            - "null"
          description: Mirrors `X-Request-Id` when available inside the handler; the response header is canonical.
    HistoryExpiredErrorResponse:
      type: object
      description: Explicit Sepolia response for indexed history intentionally removed by the rolling retention policy. It is distinct from an unknown resource (`404`) and from indexer lag.
      additionalProperties: false
      required:
        - code
        - message
        - docSlug
        - requestId
        - retentionDays
        - earliestAvailableBlock
        - earliestAvailableAt
      properties:
        code:
          type: string
          enum:
            - history_expired
        message:
          type: string
        docSlug:
          type: string
          description: Stable docs slug agents can use for next-step guidance.
        requestId:
          type:
            - string
            - "null"
          description: Mirrors `X-Request-Id` when available inside the handler; the response header is canonical.
        retentionDays:
          type: integer
          format: int32
          minimum: 1
        earliestAvailableBlock:
          type: integer
          format: int64
          minimum: 0
        earliestAvailableAt:
          type: string
          format: date-time
    JsonRpcRequest:
      type: object
      description: Starknet JSON-RPC 2.0 request object accepted by the gateway.
      required:
        - jsonrpc
        - method
      additionalProperties: true
      properties:
        jsonrpc:
          type: string
          enum:
            - "2.0"
        method:
          type: string
        params:
          oneOf:
            - type: array
              items: {}
            - type: object
              additionalProperties: true
            - type: "null"
        id:
          oneOf:
            - type: string
            - type: integer
            - type: "null"
    JsonRpcBatchRequest:
      type: array
      description: JSON-RPC batch request accepted by the gateway pilot.
      minItems: 1
      maxItems: 25
      items:
        $ref: "#/components/schemas/JsonRpcRequest"
    JsonRpcError:
      type: object
      additionalProperties: true
      required:
        - code
        - message
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          description: Optional JSON-RPC error data payload; may be any JSON value.
    JsonRpcResponse:
      type: object
      description: Starknet JSON-RPC 2.0 result or error envelope.
      required:
        - jsonrpc
        - id
      oneOf:
        - required:
            - result
          not:
            required:
              - error
        - required:
            - error
          not:
            required:
              - result
      additionalProperties: true
      properties:
        jsonrpc:
          type: string
          enum:
            - "2.0"
        id:
          oneOf:
            - type: string
            - type: integer
            - type: "null"
        result: {}
        error:
          $ref: "#/components/schemas/JsonRpcError"
    JsonRpcBatchResponse:
      type: array
      description: JSON-RPC batch response from the gateway.
      maxItems: 25
      items:
        $ref: "#/components/schemas/JsonRpcResponse"
    AgentMemoryContract:
      type: object
      additionalProperties: true
      required:
        - kind
        - schemaVersion
        - generatedFor
        - auth
        - firstCalls
        - routeFamilies
        - workspaceMemory
        - operatingRules
        - issueReportContract
      properties:
        kind:
          type: string
          enum:
            - starkscan.agent_memory
        schemaVersion:
          type: string
          example: 2026-05-02
        generatedFor:
          type: string
          enum:
            - agents
        auth:
          type: object
          additionalProperties: true
          required:
            - header
            - externalBasePath
            - defaultChain
          properties:
            header:
              type: string
              example: X-Starkscan-Api-Key
            externalBasePath:
              type: string
              example: /v1
            defaultChain:
              type: string
              example: SN_MAIN
        firstCalls:
          type: array
          items:
            $ref: "#/components/schemas/AgentFirstCall"
        routeFamilies:
          type: array
          items:
            $ref: "#/components/schemas/AgentRouteFamily"
        workspaceMemory:
          $ref: "#/components/schemas/AgentWorkspaceMemoryContract"
        operatingRules:
          type: array
          items:
            type: string
        issueReportContract:
          $ref: "#/components/schemas/AgentIssueReportContract"
    AgentFirstCall:
      type: object
      additionalProperties: true
      required:
        - method
        - path
        - purpose
      properties:
        method:
          type: string
          example: GET
        path:
          type: string
          example: /v1/meta/capabilities
        purpose:
          type: string
    AgentRouteFamily:
      type: object
      additionalProperties: true
      required:
        - name
        - tier
        - routes
        - useWhen
      properties:
        name:
          type: string
        tier:
          type: string
          enum:
            - read
            - batch
        routes:
          type: array
          items:
            type: string
        useWhen:
          type: string
    MetaCapabilitiesView:
      type: object
      additionalProperties: true
      required:
        - kind
        - schemaVersion
        - defaultChain
        - authHeader
        - firstCalls
        - routeFamilies
        - rpcProvider
        - walletInteraction
        - operatingRules
        - issueReportContract
      description: |
        Authenticated capability view for agents and developers.
      properties:
        kind:
          type: string
          enum:
            - starkscan.meta.capabilities
        schemaVersion:
          type: string
        defaultChain:
          type: string
        authHeader:
          type: string
          example: X-Starkscan-Api-Key
        firstCalls:
          type: array
          items:
            $ref: "#/components/schemas/AgentFirstCall"
        routeFamilies:
          type: array
          items:
            $ref: "#/components/schemas/AgentRouteFamily"
        rpcProvider:
          $ref: "#/components/schemas/RpcProviderCapability"
        walletInteraction:
          $ref: "#/components/schemas/WalletInteractionCapability"
        operatingRules:
          type: array
          items:
            type: string
        issueReportContract:
          $ref: "#/components/schemas/AgentIssueReportContract"
    RpcProviderCapability:
      type: object
      additionalProperties: true
      required:
        - status
        - endpoint
        - endpointTemplate
        - authHeader
        - minimumSpecVersion
        - specVersionMethod
        - supportedBlockTags
        - batch
        - writeBeta
        - quotaClasses
        - unsupportedUntilCertified
      properties:
        status:
          type: string
          enum:
            - enrolled_http_beta
            - authenticated_http_beta
        endpoint:
          type: string
          example: /api/v1/SN_MAIN/rpc
        endpointTemplate:
          type: string
          example: /api/v1/{chain}/rpc
        authHeader:
          type: string
          example: X-Starkscan-Api-Key
        minimumSpecVersion:
          type: string
          example: 0.10.2
        specVersionMethod:
          type: string
          enum:
            - starknet_specVersion
        supportedBlockTags:
          type: array
          items:
            type: string
            enum:
              - latest
              - pending
              - pre_confirmed
        batch:
          type: object
          additionalProperties: false
          required:
            - supported
            - maxItems
            - accounting
          properties:
            supported:
              type: boolean
            maxItems:
              type: integer
              minimum: 1
              maximum: 25
            accounting:
              type: string
              enum:
                - Each JSON-RPC child request is classified and rate-limited independently.
        writeBeta:
          type: object
          additionalProperties: false
          required:
            - enabled
            - status
            - openToAllApiKeys
            - methods
            - payloadPolicy
            - quotaClass
          properties:
            enabled:
              type: boolean
            status:
              type: string
              enum:
                - enrolled_write_scoped_keys_only
                - disabled_until_operator_enabled
                - all_api_keys_signed_payloads_only
            openToAllApiKeys:
              type: boolean
            methods:
              type: array
              items:
                type: string
                enum:
                  - starknet_addInvokeTransaction
                  - starknet_addDeclareTransaction
                  - starknet_addDeployAccountTransaction
            payloadPolicy:
              type: string
            quotaClass:
              type: string
              enum:
                - rpc_write
        quotaClasses:
          type: object
          additionalProperties: false
          required:
            - rpc_read_light
            - rpc_read_state
            - rpc_read_history
            - rpc_simulation
            - rpc_write
          properties:
            rpc_read_light:
              type: array
              items:
                type: string
                enum:
                  - starknet_chainId
                  - starknet_specVersion
                  - starknet_blockNumber
                  - starknet_blockHashAndNumber
                  - starknet_syncing
            rpc_read_state:
              type: array
              items:
                type: string
                enum:
                  - starknet_call
                  - starknet_getStorageAt
                  - starknet_getClass
                  - starknet_getClassHashAt
                  - starknet_getClassAt
                  - starknet_getNonce
            rpc_read_history:
              type: array
              items:
                type: string
                enum:
                  - starknet_getBlockWithTxHashes
                  - starknet_getBlockWithTxs
                  - starknet_getBlockWithReceipts
                  - starknet_getBlockTransactionCount
                  - starknet_getTransactionByBlockIdAndIndex
                  - starknet_getTransactionByHash
                  - starknet_getTransactionReceipt
                  - starknet_getTransactionStatus
                  - starknet_getStateUpdate
                  - starknet_getEvents
            rpc_simulation:
              type: array
              items:
                type: string
                enum:
                  - starknet_simulateTransactions
                  - starknet_estimateFee
                  - starknet_estimateMessageFee
            rpc_write:
              type: array
              items:
                type: string
                enum:
                  - starknet_addInvokeTransaction
                  - starknet_addDeclareTransaction
                  - starknet_addDeployAccountTransaction
        unsupportedUntilCertified:
          type: array
          items:
            type: string
            enum:
              - websocket_subscriptions
              - trace_methods_except_simulateTransactions
              - archive_history_full_provider
              - no_key_public_rpc
    WalletInteractionCapability:
      type: object
      additionalProperties: false
      required:
        - enabled
        - status
        - supportedChains
        - contractAllowlist
        - transactionPolicy
        - limits
        - simulation
      properties:
        enabled:
          type: boolean
        status:
          type: string
          enum:
            - disabled_until_operator_enabled
            - sepolia_basic_submission_pilot
        supportedChains:
          type: array
          items:
            type: string
            enum:
              - SN_SEPOLIA
        contractAllowlist:
          type: array
          maxItems: 32
          items:
            type: string
            pattern: ^0[xX][0-9a-fA-F]{1,64}$
        transactionPolicy:
          type: object
          additionalProperties: false
          required:
            - maxCalls
            - entryPointNameRequired
            - rawCalldataEnabled
            - mainnet
          properties:
            maxCalls:
              type: integer
              minimum: 0
              maximum: 1
            entryPointNameRequired:
              type: boolean
              enum:
                - true
            rawCalldataEnabled:
              type: boolean
              enum:
                - false
            mainnet:
              type: string
              enum:
                - disabled
        limits:
          type: object
          additionalProperties: false
          required:
            - maxCalls
            - maxCalldataFelts
            - maxArguments
            - maxStringBytes
          properties:
            maxCalls:
              type: integer
              enum:
                - 1
            maxCalldataFelts:
              type: integer
              enum:
                - 256
            maxArguments:
              type: integer
              enum:
                - 64
            maxStringBytes:
              type: integer
              enum:
                - 4096
        simulation:
          type: object
          additionalProperties: false
          required:
            - status
            - required
          properties:
            status:
              type: string
              enum:
                - not_certified
                - certified
              description: |
                `certified` is required before a Starkscan browser wallet flow may enable signing. `not_certified` keeps the flow fail-closed.
            required:
              type: boolean
              description: |
                Must be true with `status=certified` before a Starkscan browser wallet flow may enable signing.
          oneOf:
            - properties:
                status:
                  const: not_certified
                required:
                  const: false
            - properties:
                status:
                  const: certified
                required:
                  const: true
    MetaChainsView:
      type: object
      additionalProperties: true
      required:
        - kind
        - schemaVersion
        - defaultChain
        - chains
      properties:
        kind:
          type: string
          enum:
            - starkscan.meta.chains
        schemaVersion:
          type: string
        defaultChain:
          type: string
        chains:
          type: array
          items:
            type: object
            additionalProperties: true
            required:
              - chainId
              - statusPath
              - statusPathTemplate
            properties:
              chainId:
                type: string
              statusPath:
                type: string
              statusPathTemplate:
                type: string
        selectionRule:
          type: string
    MetaAgentContextView:
      type: object
      additionalProperties: true
      required:
        - kind
        - schemaVersion
        - agentMemory
        - workspaceMemory
        - preferredArtifactFormat
      properties:
        kind:
          type: string
          enum:
            - starkscan.meta.agent_context
        schemaVersion:
          type: string
        agentMemory:
          $ref: "#/components/schemas/AgentMemoryContract"
        workspaceMemory:
          $ref: "#/components/schemas/AgentWorkspaceMemoryContract"
        preferredArtifactFormat:
          type: string
          example: application/jsonl
    AgentWorkspaceMemoryContract:
      type: object
      additionalProperties: false
      required:
        - status
        - publicWriteApi
        - serverStoredArtifacts
        - writeSurface
        - localWorkspace
        - handoffContract
      properties:
        status:
          type: string
          enum:
            - no_public_write_api
        publicWriteApi:
          type: boolean
          enum:
            - false
        serverStoredArtifacts:
          type: string
          example: not available in this deployment
        writeSurface:
          type: string
          example: not exposed in this deployment
        localWorkspace:
          $ref: "#/components/schemas/AgentLocalWorkspaceContract"
        handoffContract:
          $ref: "#/components/schemas/AgentHandoffContract"
        rules:
          type: array
          items:
            type: string
    AgentLocalWorkspaceContract:
      type: object
      additionalProperties: false
      required:
        - status
        - defaultDirectory
        - artifactPattern
        - schemaPath
        - schemaUrl
        - guideUrl
        - validatorCommand
        - sampleCommand
      properties:
        status:
          type: string
          enum:
            - internal_local_only
        defaultDirectory:
          type: string
          example: .codex/handoffs/
        artifactPattern:
          type: string
          example: .codex/handoffs/{taskId}.jsonl
        schemaPath:
          type: string
          example: docs/maintainers/schemas/agent-handoff-artifact.schema.json
        schemaUrl:
          type: string
          example: /agent-handoff-artifact.schema.json
        guideUrl:
          type: string
