        finalizedBlockNumber:
          type:
            - integer
            - "null"
          format: int64
        latestL1AcceptedBlockNumber:
          type:
            - integer
            - "null"
          format: int64
          description: Latest Starknet block number covered by explicit L1 accepted proof, separate from finalized indexed storage.
        l1AcceptedProof:
          anyOf:
            - $ref: "#/components/schemas/L1AcceptedProofView"
            - type: "null"
