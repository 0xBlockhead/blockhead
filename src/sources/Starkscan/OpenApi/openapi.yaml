          type: string
        ownerAddress:
          type: string
        requestId:
          type: string
    WalletStateIncludeRequest:
      type: object
      properties:
        nonce:
          type: boolean
          default: false
        classHash:
          type: boolean
          default: false
      additionalProperties: false
    WalletStateRequest:
      type: object
      required:
        - ownerAddress
      properties:
        ownerAddress:
          type: string
        mode:
          type: string
          enum:
            - require_complete
            - verified_partial
          default: require_complete
        scope:
          type: string
          enum:
            - explicit
            - discovered
            - discovered_plus_registry
          description: |
            `discovered` uses wallet-observed candidates only. `discovered_plus_registry` also evaluates the curated registry and can require pagination even when no wallet-observed asset exists.
        tokenAddresses:
          type: array
          maxItems: 25
          uniqueItems: true
          items:
            type: string
        cursor:
          type: string
        limit:
          type: integer
          minimum: 1
          maximum: 25
          default: 25
        blockPreference:
          type: string
          enum:
            - latest_accepted_l2
            - l1_accepted
            - explicit
          default: latest_accepted_l2
        blockHash:
          type: string
        blockNumber:
          type: integer
          format: int64
          minimum: 0
        include:
          $ref: "#/components/schemas/WalletStateIncludeRequest"
      additionalProperties: false
    WalletStateBlock:
      type: object
      required:
        - preference
        - blockNumber
        - blockHash
        - finalityStatus
      properties:
        preference:
          type: string
        blockNumber:
          type: integer
          format: int64
        blockHash:
          type: string
        finalityStatus:
          type: string
          enum:
            - accepted_on_l2
            - accepted_on_l1
            - explicit
    WalletStatePrice:
      type: object
      required:
        - status
        - reasonCode
        - quoteCurrency
        - priceUsd
        - valueUsd
        - source
        - provider
        - confidence
        - priceTimestamp
        - observedAt
        - maxAgeSeconds
      properties:
        status:
          type: string
          enum:
            - priced
            - unavailable
          description: "`priced` is valid only with `fresh_exact_cached_price` and a non-null unit price. `valueUsd` is non-null only when the wallet balance was verified and value calculation succeeded. `unavailable` preserves the non-zero holding but excludes it from wallet totals."
        reasonCode:
          type: string
          enum:
            - fresh_exact_cached_price
            - price_metadata_unavailable
            - token_metadata_missing
            - token_unmapped
            - price_not_exact
            - price_missing
            - price_stale
            - value_calculation_failed
          description: Stable machine-readable reason for the pricing decision. A missing, empty, or unknown value is a response-contract violation; retain the response x-request-id and report it.
        quoteCurrency:
          type: string
          const: usd
        priceUsd:
          type:
            - string
            - "null"
        valueUsd:
          type:
            - string
            - "null"
        source:
          type:
            - string
            - "null"
        provider:
          type:
            - string
            - "null"
        confidence:
          type:
            - string
            - "null"
        priceTimestamp:
          type:
            - string
            - "null"
          format: date-time
          description: Provider quote timestamp used for the freshness decision; distinct from observedAt, which is materialization time.
        observedAt:
          type:
            - string
            - "null"
          format: date-time
          description: Time Starkscan materialized the quote; not the provider quote timestamp.
        maxAgeSeconds:
          type:
            - integer
            - "null"
    WalletStateAsset:
      type: object
      required:
        - tokenAddress
        - balanceRaw
        - status
        - metadata
        - price
      properties:
        tokenAddress:
          type: string
        balanceRaw:
          type:
            - string
            - "null"
          description: Present only when balanceOf succeeded at block.blockHash. Never indexed or synthesized from an error.
        status:
          type: string
          enum:
            - ok
            - unsupported
            - timeout
            - error
        metadata:
          $ref: "#/components/schemas/WalletAssetDiscoveryMetadata"
        price:
          $ref: "#/components/schemas/WalletStatePrice"
    WalletStateVerification:
      type: object
      required:
        - selected
        - verified
        - visibleNonZero
        - verifiedZeroHidden
        - failed
        - timedOut
        - unsupported
      properties:
        selected:
          type: integer
          description: Token candidates selected for block-pinned balance verification. Account-state reads are not included.
        verified:
          type: integer
          description: Token balanceOf calls that succeeded at block.blockHash, including verified zeros.
        visibleNonZero:
          type: integer
          description: Verified non-zero token balances returned in items.
        verifiedZeroHidden:
          type: integer
          description: Verified zero token balances intentionally omitted from items.
        failed:
          type: integer
          description: Token balance verification failures only. Inspect accountState statuses separately.
        timedOut:
          type: integer
          description: Failed token verifications classified as timeouts.
        unsupported:
          type: integer
          description: Failed token verifications classified as unsupported balanceOf behavior.
    WalletStateAccountState:
      type: object
      required:
        - nonce
        - nonceStatus
        - classHash
        - classHashStatus
      properties:
        nonce:
          type:
            - string
            - "null"
        nonceStatus:
          type: string
          enum:
            - not_requested
            - verified
            - timeout
            - error
        classHash:
          type:
            - string
            - "null"
        classHashStatus:
          type: string
          enum:
            - not_requested
            - verified
            - timeout
            - error
    WalletStateValuation:
      type: object
      required:
        - scope
        - singlePageComplete
        - completeForWallet
        - totalUsd
        - pricedAssetCount
        - unpricedNonZeroAssetCount
        - excludedUnpricedAssets
      properties:
        scope:
          type: string
          const: page
          description: Valuation counters and totalUsd cover only items in this response page.
        singlePageComplete:
          type: boolean
          description: True only when this discovery walk began without a cursor and the first response is terminal. It says the page is the whole selected discovery walk; it never describes a continuation page or a caller-supplied explicit token subset.
        completeForWallet:
          type: boolean
          deprecated: true
          description: Deprecated compatibility alias for singlePageComplete. On raw scope=page responses this is not a wallet-wide valuation guarantee. Use hasMore=false or nextCursor=null to detect walk termination, or the SDK aggregate's scope=wallet result for wallet-wide valuation.
        totalUsd:
          type:
            - string
            - "null"
          description: Exact decimal subtotal for priced assets in this response page. Raw scope=page responses never make this a wallet-wide total.
        pricedAssetCount:
          type: integer
        unpricedNonZeroAssetCount:
          type: integer
        excludedUnpricedAssets:
          type: boolean
          description: True means unpriced non-zero assets remain visible but are excluded from totalUsd; they are never counted as zero.
    WalletStateResponse:
      type: object
      required:
        - schemaVersion
        - chainId
        - ownerAddress
        - requestId
        - block
        - scope
        - coverage
        - correctness
        - partial
        - walletSafe
        - items
        - verification
        - accountState
        - valuation
        - hasMore
        - nextCursor
      properties:
        schemaVersion:
