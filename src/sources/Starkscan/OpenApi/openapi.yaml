    BlockReference:
      oneOf:
        - type: string
          enum:
            - latest
            - pending
        - type: string
          pattern: ^[0-9]+$
          maxLength: 19
          description: Decimal block number. Must be non-negative and fit in signed 64-bit range.
        - type: string
          pattern: ^0[xX][0-9a-fA-F]{1,128}$
          maxLength: 130
          description: 0x-prefixed Starknet block hash/felt.
      description: State reference. Block hashes are validated against the Starknet field range; decimal block numbers must be non-negative signed 64-bit values.
    ErrorResponse:
      type: object
      description: |
        Machine-readable error envelope. JSON error responses also emit `X-Request-Id` as the canonical correlation header when the request has one; `requestId` mirrors it when available inside the handler.
      additionalProperties: false
      required:
        - code
        - message
        - docSlug
        - requestId
      properties:
        code:
          type: string
          enum:
            - invalid_request
            - invalid_cursor
            - unauthorized
            - forbidden
            - not_found
            - conflict
            - rate_limited
            - service_unavailable
            - event_positional_scan_timeout
            - event_positional_index_timeout
            - event_key_index_coverage_unavailable
            - full_range_selector_not_supported
            - internal_error
            - api_error
        message:
          type: string
        docSlug:
          type: string
          description: Stable docs slug agents can use for next-step guidance.
        requestId:
          type:
            - string
            - "null"
          description: Mirrors `X-Request-Id` when available inside the handler; the response header is canonical.
        maxServableToBlock:
          type: integer
          format: int64
          minimum: 0
          description: Highest `to_block` proved servable for the exact failed selector/key request. Present only for coverage-unavailable errors with a safe non-empty prefix.
    HistoryExpiredErrorResponse:
      type: object
      description: Explicit Sepolia response for a request before the certified fixed indexed-history boundary. It is distinct from an unknown resource (`404`) and from indexer lag.
      additionalProperties: false
      required:
        - code
        - message
        - docSlug
        - requestId
        - historyPolicy
        - historyCompleteness
        - earliestAvailableBlock
        - earliestAvailableAt
      properties:
        code:
          type: string
          enum:
            - history_expired
        message:
          type: string
        docSlug:
          type: string
          description: Stable docs slug agents can use for next-step guidance.
        requestId:
          type:
            - string
            - "null"
          description: Mirrors `X-Request-Id` when available inside the handler; the response header is canonical.
        historyPolicy:
          type: string
          enum:
            - fixed_start
        historyCompleteness:
          type: string
          enum:
            - complete_from_earliest_available
        retentionDays:
          type: integer
          format: int32
          minimum: 1
          description: Legacy rolling-window duration. Omitted for the fixed-start Sepolia policy.
        earliestAvailableBlock:
          type: integer
          format: int64
          minimum: 0
        earliestAvailableAt:
          type: string
          format: date-time
