        - ownerAddress
        - items
        - exact
        - truncated
        - completeness
      properties:
        chainId:
          type: string
        ownerAddress:
          type: string
        items:
          description: |
            Holdings are capped at 256 items. When `truncated` is true, older or lower-priority holdings were omitted from this response.
          type: array
          maxItems: 256
          items:
            $ref: "#/components/schemas/AddressTokenHoldingItemView"
        exact:
          description: |
