openapi: 3.1.0
info:
  title: Starkscan Explorer API
  version: 2.1.0
  description: Starkscan public explorer contract for external integrators, SDKs, CLI workflows, and direct API integrations, including beta Privacy Pool activity, evidence, metrics, and finalized public-flow routes. Operation-level certification and stability metadata define the support boundary.
servers:
  - url: https://api.starkscan.co
    description: Hosted external Starkscan API base. Requests execute against /v1/* on the API host; app-host /api/v1/* remains compatibility.
security:
  - StarkscanApiKey: []
paths:
  /v1/{chain}/staking:
    get:
      operationId: getStakingSummary
      summary: Prepared finalized staking summary
      description: DB-only prepared staking facts; no RPC, provider, raw-event, historical-price, or request-time complete-set scan.
      externalDocs:
        description: Prepared staking integration and coverage guide
        url: https://starkscan.co/docs/api/staking
      parameters:
        - $ref: "#/components/parameters/ChainParam"
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Prepared summary with typed coverage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StakingSummaryPage"
        "401":
          $ref: "#/components/responses/UnauthorizedText"
        "403":
          $ref: "#/components/responses/ForbiddenText"
        "429":
          $ref: "#/components/responses/RateLimited"
      x-starkscan-audience: public-core
      x-starkscan-certification: beta
      x-starkscan-stability: stable
      x-starkscan-surface-tier: official-public-api
      x-starkscan-key-tier: read
      security:
        - StarkscanApiKey: []
      tags:
        - Reference
  /v1/{chain}/staking/validators:
    get:
      operationId: listStakingValidators
      summary: Page prepared finalized validators
      parameters:
        - $ref: "#/components/parameters/ChainParam"
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 1024
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Bounded keyset page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StakingValidatorPage"
        "401":
          $ref: "#/components/responses/UnauthorizedText"
        "403":
          $ref: "#/components/responses/ForbiddenText"
        "429":
          $ref: "#/components/responses/RateLimited"
      x-starkscan-audience: public-core
      x-starkscan-certification: beta
      x-starkscan-stability: stable
      x-starkscan-surface-tier: official-public-api
      x-starkscan-key-tier: read
      security:
        - StarkscanApiKey: []
      tags:
        - Reference
  /v1/{chain}/staking/validators/{address}:
    get:
      operationId: getStakingValidator
      summary: Prepared validator detail with per-token pools and address histories
      parameters:
        - $ref: "#/components/parameters/ChainParam"
        - name: address
          in: path
          required: true
          example: "0x0123456789abcdef"
          schema:
            type: string
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Prepared validator detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StakingValidatorDetail"
        "401":
          $ref: "#/components/responses/UnauthorizedText"
        "403":
          $ref: "#/components/responses/ForbiddenText"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
      x-starkscan-audience: public-core
      x-starkscan-certification: beta
      x-starkscan-stability: stable
      x-starkscan-surface-tier: official-public-api
      x-starkscan-key-tier: read
      security:
        - StarkscanApiKey: []
      tags:
        - Reference
  /v1/{chain}/staking/validators/{address}/delegators:
    get:
      operationId: listStakingDelegators
      summary: Page prepared finalized delegators
      parameters:
        - $ref: "#/components/parameters/ChainParam"
        - name: address
          in: path
          required: true
          example: "0x0123456789abcdef"
          schema:
            type: string
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 1024
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Bounded delegator page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StakingDelegatorPage"
        "401":
          $ref: "#/components/responses/UnauthorizedText"
        "403":
          $ref: "#/components/responses/ForbiddenText"
        "429":
          $ref: "#/components/responses/RateLimited"
      x-starkscan-audience: public-core
      x-starkscan-certification: beta
      x-starkscan-stability: stable
      x-starkscan-surface-tier: official-public-api
      x-starkscan-key-tier: read
      security:
        - StarkscanApiKey: []
      tags:
        - Reference
  /v1/{chain}/staking/activity:
    get:
      operationId: listStakingActivity
      summary: Page prepared transaction-linked staking activity
      parameters:
        - $ref: "#/components/parameters/ChainParam"
        - name: validator
          in: query
          schema:
            type: string
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 1024
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Bounded activity page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StakingActivityPage"
        "401":
          $ref: "#/components/responses/UnauthorizedText"
        "403":
          $ref: "#/components/responses/ForbiddenText"
        "429":
          $ref: "#/components/responses/RateLimited"
      x-starkscan-audience: public-core
      x-starkscan-certification: beta
      x-starkscan-stability: stable
      x-starkscan-surface-tier: official-public-api
      x-starkscan-key-tier: read
      security:
        - StarkscanApiKey: []
      tags:
        - Reference
  /v1/{chain}/staking/address/{address}:
    get:
      operationId: getAddressStaking
      summary: Prepared address staking positions and history
      parameters:
        - $ref: "#/components/parameters/ChainParam"
        - name: address
          in: path
          required: true
          example: "0x0123456789abcdef"
          schema:
            type: string
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 1024
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Prepared positions and bounded history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StakingAddressView"
        "401":
          $ref: "#/components/responses/UnauthorizedText"
        "403":
          $ref: "#/components/responses/ForbiddenText"
        "429":
          $ref: "#/components/responses/RateLimited"
      x-starkscan-audience: public-core
      x-starkscan-certification: beta
      x-starkscan-stability: stable
      x-starkscan-surface-tier: official-public-api
      x-starkscan-key-tier: read
      security:
        - StarkscanApiKey: []
      tags:
        - Reference
  /.well-known/starkscan-agent.json:
    get:
      summary: Agent-readable Starkscan memory contract
      description: |-
        Public machine-readable discovery document for agents. It points agents
        at the authenticated meta routes, route families, operating rules, and
        typed artifact contract without requiring chat history.
      servers:
        - url: /
          description: Same-host public well-known discovery root
      security:
        - {}
      responses:
        "200":
          description: Agent-readable discovery and operating contract
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentMemoryContract"
      x-starkscan-audience: public-core
      x-starkscan-certification: certified
      x-starkscan-stability: stable
      x-starkscan-surface-tier: official-public-api
      x-starkscan-key-tier: public
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      tags:
        - Reference
  /v1/meta/capabilities:
    get:
      summary: Agent-readable API capabilities
      description: Authenticated route-family catalog for agents and developers. Hosted external clients call `/v1/meta/capabilities` with `X-Starkscan-Api-Key`. Same-origin explorer traffic uses this `/v1` route through the trusted edge. Use this before selecting the smallest route set for a task. A chain-specific token-holder registry is omitted with `policy_registry_chain_mismatch` when it does not match the deployment's default chain.
      externalDocs:
        description: Discovery workflow and published JSON Schema
        url: https://starkscan.co/docs/api/discovery
      security:
        - StarkscanApiKey: []
      responses:
        "200":
          description: Capability and route-family catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaCapabilitiesView"
              examples:
                trustedSameOrigin:
                  summary: Bounded representative trusted same-origin response without credential identity
                  value:
                    kind: starkscan.meta.capabilities
                    schemaVersion: '2026-08-10'
                    defaultChain: SN_MAIN
                    authHeader: X-Starkscan-Api-Key
                    externalBasePath: /v1
                    firstCalls:
                      - method: GET
                        path: /v1/meta/chains
                        purpose: Discover supported chains.
                    documentation: &a1
                      openapiUrl: https://starkscan.co/starkscan-openapi.yaml
                      openapiPath: /starkscan-openapi.yaml
                      openapiFormat: OpenAPI 3.1
                      operationReferenceFormat: URI-encoded JSON Pointer fragment
                      operationLookup: Percent-decode the URI fragment once, then resolve the JSON Pointer in the fetched OpenAPI document.
                    rateLimit: &a2
                      responseHeaders:
                        routeClass: X-Starkscan-Route-Class
                        limit: x-ratelimit-limit
                        remaining: x-ratelimit-remaining
                        policy: x-ratelimit-policy
                        retryAfter: Retry-After
                      classes:
                        - light
                        - heavy
                        - batch
                      operationDisclosure: Route-family operations disclose their response rate-limit class for class-specific backoff.
                      retryRule: On 429, honor Retry-After before retrying the same route class; rate limits are not credential revocation.
                    routeFamilies:
                      - name: status
                        tier: read
                        routes:
                          - GET /v1/{chain}/status
                        operations:
                          - method: GET
                            path: /v1/{chain}/status
                            openapiPath: /v1/{chain}/status
                            openapiMethod: get
                            openapiOperationRef: "#/paths/~1v1~1%7Bchain%7D~1status/get"
                            rateLimitClass: light
                            summary: Read bounded service and indexing status.
                        useWhen: Check service readiness and indexed progress.
                    sessionControl: &a3
                      status: separate_dashboard_session_control_plane
                      pathPrefix: /v1/me
                      apiKeyAccess: not_supported
                      safeReadAuth:
                        - better_auth_session_cookie
                        - bearer_session_token
                      mutationAuth: bearer_session_token
                      documentationPath: /docs/api/self-serve
                    apiKeyLifecycle: &a4
                      inactiveKeyResponse: generic_401_invalid_token
                      inactiveKeyWwwAuthenticate: Bearer realm="starkscan", error="invalid_token"
                      rateLimitResponse: 429_with_retry_after
                      ownerInspectionPath: /v1/me/api-keys
                      internalObservability: sanitized_lifecycle_reason_metrics
                    caller:
                      authenticated: true
                      authType: internal
                      keyClass: internal
                      scopes: []
                      scopeDisclosure: operator_internal
                      routeFamilyDisclosure: global_operator_view
                      workspacePlan: null
                      rateLimit: null
                    eventSearch: &a5
                      chain: SN_MAIN
                      positions:
                        minimum: 0
                        maximum: 15
                      bounded:
                        enabled: true
                        maximumBlocksInclusive: 10000
                      fullRange:
                        entitled: false
                        requiredWorkspacePlan: wallet
                        coverageContract: certified_per_selector_position
                        unsupportedResponse: 422_full_range_selector_not_supported
                        unavailableResponse: 503_event_key_index_coverage_unavailable
                        coverageAvailability: unavailable
                        selectorCoverage: []
                    rpcProvider:
                      status: enrolled_http_beta
                      endpoint: /v1/SN_MAIN/rpc
                      endpointTemplate: /v1/{chain}/rpc
                      authHeader: X-Starkscan-Api-Key
                      minimumSpecVersion: 0.10.2
                      publicSpecVersion: 0.10.2
                      specVersionContract: gateway_declared_compatibility
                      specVersionMethod: starknet_specVersion
                      supportedBlockTags: &a6
                        - latest
                        - pending
                        - pre_confirmed
                      conditionalBlockTags: &a7
                        l1_accepted:
                          advertised: false
                          evidence: indexed_canonical_l1_accepted_watermark
                      batch: &a8
                        supported: true
                        maxItems: 50
                        maxResponseBytes: 16777216
                        accounting: Each JSON-RPC child request is classified and rate-limited independently.
                      storageProofBeta: &a9
                        enabled: true
                        status: bounded_upstream_passthrough
                        availability: upstream_dependent
                        method: starknet_getStorageProof
                        quotaClass: rpc_read_state
                        acceptedBlockIds:
                          - latest
                          - block_number
                          - block_hash
                        rejectedBlockTags:
                          - pending
                          - pre_confirmed
                        limits:
                          maxClassHashes: 8
                          maxContractAddresses: 8
                          maxContractStoragePairs: 8
                          maxStorageKeysPerContract: 16
                          maxTotalTargets: 32
                          totalTargetCounting: class_hashes_plus_contract_addresses_plus_individual_storage_keys
                          maxResponseBytes: 1048576
                        historicalHorizon:
                          advertised: false
                          status: not_certified
                          guaranteedBlocksBehindHead: null
                          certificationTargetBlocksBehindHead: 50000
                          policy: Fixed historical block requests are forwarded to the configured upstream without an advertised archive guarantee.
                        stateDiffCommitment:
                          advertised: false
                          guaranteed: false
                          status: not_in_starknet_openrpc_0_10_2
                          passthroughPolicy: preserved_if_returned_by_upstream_not_synthesized_or_certified
                          policy: State-diff commitment is not synthesized or certified.
                        responseValidation: opaque_upstream_result_size_bounded
                      writeBeta: &a10
                        enabled: false
                        status: disabled_until_operator_enabled
                        openToAllApiKeys: false
                        methods: []
                        payloadPolicy: Signed payloads only when explicitly enabled.
                        quotaClass: rpc_write
                      traceBeta: &a11
                        status: operator_scoped
                        scope: trace
                        methods:
                          - starknet_traceTransaction
                          - starknet_traceBlockTransactions
                        quotaClass: rpc_trace
                        maxResponseBytes: 16777216
                        stateDiffPolicy: omitted_use_starknet_getStateUpdate
                        incompleteResponsePolicy: fail_closed_trace_response_incomplete
                        policy: Available only to configured trace-scoped keys.
                      quotaClasses: &a12
                        rpc_read_light:
                          - starknet_blockNumber
                        rpc_read_state:
                          - starknet_call
                        rpc_read_history:
                          - starknet_getTransactionByHash
                        rpc_simulation:
                          - starknet_estimateFee
                        rpc_write:
                          - starknet_addInvokeTransaction
                        rpc_trace:
                          - starknet_traceTransaction
                      unsupportedUntilCertified: &a13
                        - websocket_subscriptions
                        - archive_history_full_provider
                        - no_key_public_rpc
                    walletInteraction: &a14
                      enabled: false
                      status: disabled_until_operator_enabled
                      supportedChains: []
                      contractAllowlist: []
                      transactionPolicy:
                        maxCalls: 0
                        entryPointNameRequired: true
                        rawCalldataEnabled: false
                        mainnet: disabled
                      limits:
                        maxCalls: 1
                        maxCalldataFelts: 256
                        maxArguments: 64
                        maxStringBytes: 4096
                      simulation:
                        status: not_certified
                        required: false
                    operatingRules: &a15
                      - Use only operations advertised for the current caller.
                    issueReportContract: &a16
                      requiredFields:
                        - route
                        - queryParams
                        - requestBody
                        - responseStatus
                        - responseSnippet
                        - xRequestId
                      rule: Include exact request details and X-Request-Id; redact credentials and secrets.
                configuredReadKey:
                  summary: Bounded representative configured read-only key response without credential identity
                  value:
                    kind: starkscan.meta.capabilities
                    schemaVersion: '2026-08-10'
                    defaultChain: SN_MAIN
                    authHeader: X-Starkscan-Api-Key
                    externalBasePath: /api/v1
                    firstCalls:
                      - method: GET
                        path: /api/v1/meta/chains
                        purpose: Discover supported chains.
                    documentation: *a1
                    rateLimit: *a2
                    routeFamilies:
                      - name: status
                        tier: read
                        routes:
                          - GET /api/v1/{chain}/status
                        operations:
                          - method: GET
                            path: /api/v1/{chain}/status
                            openapiPath: /v1/{chain}/status
                            openapiMethod: get
                            openapiOperationRef: "#/paths/~1v1~1%7Bchain%7D~1status/get"
                            rateLimitClass: light
                            summary: Read bounded service and indexing status.
                        useWhen: Check service readiness and indexed progress.
                    sessionControl: *a3
                    apiKeyLifecycle: *a4
                    caller:
                      authenticated: true
                      authType: tester
                      keyClass: configured
                      scopes:
                        - read
                      scopeDisclosure: exact_for_api_key
                      routeFamilyDisclosure: exact_for_api_key
                      workspacePlan: null
                      rateLimit:
                        loadClass: light
                        limitPerMinute: 120
                        remaining: 120
                        retryAfterSeconds: 0
                        bucketScope: key
                    eventSearch: *a5
                    rpcProvider:
                      status: authenticated_http_beta
                      endpoint: /api/v1/SN_MAIN/rpc
                      endpointTemplate: /api/v1/{chain}/rpc
                      authHeader: X-Starkscan-Api-Key
                      minimumSpecVersion: 0.10.2
                      publicSpecVersion: 0.10.2
                      specVersionContract: gateway_declared_compatibility
                      specVersionMethod: starknet_specVersion
                      supportedBlockTags: *a6
                      conditionalBlockTags: *a7
                      batch: *a8
                      storageProofBeta: *a9
                      writeBeta: *a10
                      traceBeta: *a11
                      quotaClasses: *a12
                      unsupportedUntilCertified: *a13
                    walletInteraction: *a14
                    operatingRules: *a15
                    issueReportContract: *a16
        "401":
          $ref: "#/components/responses/UnauthorizedText"
        "403":
          $ref: "#/components/responses/ForbiddenText"
        "429":
          $ref: "#/components/responses/RateLimited"
      x-starkscan-audience: public-core
      x-starkscan-certification: beta
      x-starkscan-stability: stable
      x-starkscan-surface-tier: official-public-api
      x-starkscan-key-tier: read
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      tags:
        - Reference
  /v1/meta/chains:
    get:
      summary: Supported chain ids for this deployment
      description: Authenticated chain catalog. Hosted external clients call `/v1/meta/chains` with `X-Starkscan-Api-Key`. Same-origin explorer traffic uses this `/v1` route through the trusted edge.
      security:
        - StarkscanApiKey: []
      responses:
        "200":
          description: Supported chain metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaChainsView"
              examples:
                boundedResponse:
                  summary: Supported-chain discovery response
                  value:
                    kind: starkscan.meta.chains
                    schemaVersion: '2026-05-02'
                    defaultChain: SN_MAIN
                    chains:
                      - chainId: SN_MAIN
                        statusPath: /v1/SN_MAIN/status
                        statusPathTemplate: /v1/{chain}/status
                    selectionRule: Select a chain returned by this endpoint.
        "401":
          $ref: "#/components/responses/UnauthorizedText"
        "403":
          $ref: "#/components/responses/ForbiddenText"
        "429":
          $ref: "#/components/responses/RateLimited"
      x-starkscan-audience: public-core
      x-starkscan-certification: beta
      x-starkscan-stability: stable
      x-starkscan-surface-tier: official-public-api
      x-starkscan-key-tier: read
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      tags:
        - Reference
  /v1/meta/agent-context:
    get:
      summary: Full agent context contract
      description: Authenticated context document that combines the public agent-memory contract with handoff artifact guidance. Hosted external clients call `/v1/meta/agent-context` with `X-Starkscan-Api-Key`. Same-origin explorer traffic uses this `/v1` route through the trusted edge.
      security:
        - StarkscanApiKey: []
      responses:
        "200":
          description: Full agent context contract
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaAgentContextView"
              examples:
                boundedResponse:
                  summary: Agent context with source-owned handoff guidance
                  value:
                    kind: starkscan.meta.agent_context
                    schemaVersion: '2026-08-10'
                    agentMemory:
                      kind: starkscan.agent_memory
                      schemaVersion: '2026-05-02'
                      generatedFor: agents
                      auth:
                        header: X-Starkscan-Api-Key
                        externalBasePath: /v1
                        defaultChain: SN_MAIN
                      firstCalls:
                        - method: GET
                          path: /v1/meta/capabilities
                          purpose: Discover caller-safe operations.
                      routeFamilies:
                        - name: status
                          tier: read
                          routes:
                            - GET /v1/{chain}/status
                          useWhen: Check service and indexing status.
                      workspaceMemory: &a17
                        status: no_public_write_api
                        publicWriteApi: false
                        serverStoredArtifacts: not available in this deployment
                        writeSurface: not exposed in this deployment
                        localWorkspace:
                          status: internal_local_only
                          defaultDirectory: .codex/handoffs/
                          artifactPattern: .codex/handoffs/{taskId}.jsonl
                          schemaPath: docs/maintainers/schemas/agent-handoff-artifact.schema.json
                          schemaUrl: /agent-handoff-artifact.schema.json
                          guideUrl: /agent-workspace.md
                          validatorCommand: python3 scripts/ci/agent-handoff.py validate .codex/handoffs/{taskId}.jsonl
                          sampleCommand: python3 scripts/ci/agent-handoff.py sample --task-id example --created-by agent
                        handoffContract:
                          sourceOfTruth: typed JSON/JSONL artifacts, not chat history
                          artifactKinds:
                            - summary
                            - claim
                            - next_step
                          requiredFields:
                            - kind
                            - schemaVersion
                            - artifactId
                          evidenceRule: Claims point to a route, file, issue, PR, or request ID.
                          formats:
                            - application/json
                            - application/jsonl
                        rules:
                          - Never store credentials in a handoff artifact.
                      operatingRules:
                        - Use typed handoff artifacts for durable state.
                      issueReportContract:
                        requiredFields:
                          - route
                          - queryParams
                          - requestBody
                          - responseStatus
                          - responseSnippet
                          - xRequestId
                        rule: Include exact request details and X-Request-Id; redact credentials and secrets.
                    workspaceMemory: *a17
                    preferredArtifactFormat: application/jsonl
        "401":
          $ref: "#/components/responses/UnauthorizedText"
        "403":
          $ref: "#/components/responses/ForbiddenText"
        "429":
          $ref: "#/components/responses/RateLimited"
      x-starkscan-audience: public-core
      x-starkscan-certification: beta
      x-starkscan-stability: stable
      x-starkscan-surface-tier: official-public-api
      x-starkscan-key-tier: read
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      tags:
        - Reference
  /v1/meta/status:
    get:
      summary: Reject the non-chain meta status alias
      description: "`meta` is a discovery namespace, not a Starknet chain. This route always returns a typed HTTP 404 so agents cannot mistake an all-null pseudo-chain payload for a health check. Read `/v1/meta/chains`, then request `/v1/{chain}/status` for a supported chain. The trusted app-host `/v1/*` lane supplies internal authentication; direct API-host callers retain the normal Starkscan API-key boundary."
      security:
        - StarkscanApiKey: []
      responses:
        "401":
          $ref: "#/components/responses/UnauthorizedText"
        "403":
          $ref: "#/components/responses/ForbiddenText"
        "404":
          description: The meta namespace is not a chain.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
      x-starkscan-audience: public-core
      x-starkscan-certification: beta
      x-starkscan-stability: stable
      x-starkscan-surface-tier: official-public-api
      x-starkscan-key-tier: read
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      tags:
        - Reference
  /v1/{chain}/status:
    get:
      summary: Chain status
      description: Current indexed, finalized, and L1 evidence status for a supported Starknet chain. `meta` is a discovery namespace, not a chain; `/v1/meta/status` returns a typed HTTP 404. Read `/v1/meta/chains`, then use one of the returned chain ids here.
      security:
        - StarkscanApiKey: []
      parameters:
