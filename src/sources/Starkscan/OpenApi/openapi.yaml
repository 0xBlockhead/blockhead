  /v1/{chain}/block-at-timestamp:
    get:
      summary: Resolve timestamp to indexed block
      description: Resolve a Unix seconds or RFC3339 timestamp to the closest indexed Starknet block. `closest=before` is the default and is the right choice for accounting "as of" balance snapshots such as calendar close. The route is served from indexed block facts only; RPC is used by the correctness gate, not by the request path.
      security:
        - StarkscanApiKey: []
      parameters:
        - $ref: "#/components/parameters/ChainParam"
        - name: timestamp
          in: query
          required: true
          description: Unix seconds or RFC3339 timestamp with timezone.
          schema:
            oneOf:
              - type: string
                pattern: ^[0-9]{1,19}$
                description: Unix seconds.
              - type: string
                format: date-time
                maxLength: 96
                description: RFC3339 timestamp with timezone.
          example: '2025-12-31T23:59:59Z'
        - name: closest
          in: query
          description: |
            Direction for the selected block. `before` returns the last indexed block at or before the timestamp; `after` returns the first indexed block at or after the timestamp.
          schema:
            type: string
            enum:
              - before
              - after
            default: before
          example: before
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Timestamp resolution with inclusive indexed bounds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockAtTimestampView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/UnauthorizedText"
        "403":
          $ref: "#/components/responses/ForbiddenText"
        "404":
          description: No indexed block exists in the requested closest direction
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          $ref: "#/components/responses/HistoryExpired"
        "429":
          $ref: "#/components/responses/RateLimited"
      x-starkscan-audience: public-core
      x-starkscan-certification: certified
      x-starkscan-stability: stable
      x-starkscan-surface-tier: official-public-api
      x-starkscan-key-tier: read
      tags:
        - Blocks
