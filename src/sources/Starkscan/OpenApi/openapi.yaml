          description: True when both class hash and canonical deployment block are available.
        source:
          type: string
          enum:
            - indexed_read_model
      allOf:
        - oneOf:
            - required:
                - isToken
                - tokenKind
                - alias
              properties:
                isToken:
                  type: "null"
                tokenKind:
                  type: "null"
                alias:
                  type: "null"
            - required:
                - isToken
                - tokenKind
              properties:
                isToken:
                  type: boolean
                  enum:
                    - true
                tokenKind:
                  type: string
                  enum:
                    - erc20
                    - erc721
                    - erc1155
                    - unknown
    AddressSummaryBatchRequest:
