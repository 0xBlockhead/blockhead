    TokenHoldingsCompletenessReasonCode:
      type: string
      enum:
        - complete
        - indexLag
        - boundedComputation
        - responseCap
        - metadataPending
        - degradedFallback
        - unknown
      description: |
        `complete` means the full inventory and every returned balance are independently certified for portfolio parity checks. Other values are useful evidence but not exact portfolio ground truth. `lagBlocks` measures indexed-source lag only and must not be interpreted as per-token `balanceOf` freshness.
    AddressTokenHoldingsCompletenessView:
      type: object
      additionalProperties: false
      required:
        - exact
        - truncated
        - complete
        - reasonCode
        - reason
        - lagBlocks
        - capped
        - cap
      properties:
        exact:
          type: boolean
          description: Mirrors the top-level `exact` field.
        truncated:
          type: boolean
          description: Mirrors the top-level `truncated` field.
        complete:
          type: boolean
          description: |
            True only when the response is exact, not truncated, and `reasonCode=complete`.
        reasonCode:
          $ref: "#/components/schemas/TokenHoldingsCompletenessReasonCode"
        reason:
          type: string
          description: Human-readable explanation for the current completeness state.
        lagBlocks:
          type:
            - integer
            - "null"
          format: int64
          description: |
            Indexed-source lag in blocks when known. Zero does not certify that any token balance equals on-chain `balanceOf`. Null means the route cannot attribute index lag for this response.
        capped:
          type: boolean
          description: True when a response cap affected the result.
        cap:
          type:
            - integer
            - "null"
          format: int32
          description: Effective response cap when capped, otherwise null.
    AddressTokenHoldingsView:
      type: object
      additionalProperties: false
      required:
        - chainId
        - ownerAddress
        - items
        - exact
        - truncated
        - completeness
      properties:
        chainId:
          type: string
        ownerAddress:
          type: string
        items:
          description: |
            Legacy bounded indexed observations embedded in a larger explorer response. These rows are not wallet-safe balance authority. Use assets/discovery for candidates and query/wallet-state for balances verified at one immutable block hash.
          type: array
          maxItems: 256
          items:
            $ref: "#/components/schemas/AddressTokenHoldingItemView"
        exact:
          description: |
            True only when the complete token inventory and every returned balance are independently certified at one chain snapshot. Transfer-derived materialization alone never satisfies this field.
          type: boolean
        truncated:
          description: True when this response is a bounded subset of the holdings snapshot.
          type: boolean
        completeness:
          $ref: "#/components/schemas/AddressTokenHoldingsCompletenessView"
    AddressTokenHoldingsPageView:
      type: object
      additionalProperties: false
      required:
        - chainId
        - ownerAddress
        - items
        - exact
        - truncated
        - completeness
        - balanceSource
        - balanceVerifiedAtBlock
        - nextCursor
        - snapshotId
        - snapshotExact
        - hasMore
        - pageLimit
        - sort
      allOf:
        - if:
            properties:
              balanceSource:
                const: pinnedRpcBalanceOf
            required:
              - balanceSource
          then:
            properties:
              balanceVerifiedAtBlock:
                type: string
        - if:
            properties:
              balanceSource:
                const: indexedTransferLedger
            required:
              - balanceSource
          then:
            properties:
              balanceVerifiedAtBlock:
                type: "null"
        - if:
            properties:
              exact:
                const: true
            required:
              - exact
          then:
            properties:
              balanceSource:
                const: pinnedRpcBalanceOf
              completeness:
                allOf:
                  - $ref: "#/components/schemas/AddressTokenHoldingsCompletenessView"
                  - properties:
                      exact:
                        const: true
                      complete:
                        const: true
                      reasonCode:
                        const: complete
      properties:
        chainId:
          type: string
        ownerAddress:
          type: string
        items:
          description: |
            One page of non-zero holdings, capped at 256 items. Curated known tokens rank before unknown tokens; each group then uses descending raw balance and ascending normalized token address. When `nextCursor` is non-null, follow it to retrieve the remaining rows.
          type: array
          maxItems: 256
          items:
            $ref: "#/components/schemas/AddressTokenHoldingItemView"
        exact:
          description: |
            True only when this response alone contains a complete token inventory whose balances are independently certified at one chain snapshot. Transfer-derived materialization alone never satisfies this field. Multi-page responses remain false because no single page contains the complete portfolio.
          type: boolean
        truncated:
          description: True when this response is a bounded subset of the holdings snapshot.
          type: boolean
        completeness:
          $ref: "#/components/schemas/AddressTokenHoldingsCompletenessView"
        balanceSource:
          type: string
          enum:
            - indexedTransferLedger
            - pinnedRpcBalanceOf
          description: |
            Provenance for every `indexedBalanceRaw` value in this page. `pinnedRpcBalanceOf` is emitted only after every returned indexed candidate was verified successfully at one block and verified zeros were removed.
        balanceVerifiedAtBlock:
          type:
            - string
            - "null"
          description: |
            Pinned block hash when `balanceSource=pinnedRpcBalanceOf`; null for transfer-derived or legacy fallback pages.
        nextCursor:
          type:
            - string
            - "null"
          description: Opaque keyset cursor for the next page, or null on the terminal page.
        snapshotId:
          type:
            - string
            - "null"
          description: |
            Address holdings version pinned by this cursor sequence. Null only for a non-pageable compatibility response while the versioned read model is warming.
        snapshotExact:
          type: boolean
          description: |
            True when all pages identified by snapshotId describe one stable indexed holdings snapshot. This is cursor-consistency provenance only: it does not certify token discovery or `balanceOf` values and can be true while top-level `exact` is false.
        hasMore:
          type: boolean
          description: True exactly when nextCursor is non-null.
        pageLimit:
          type: integer
          format: int32
          minimum: 1
          maximum: 256
          description: Effective item limit applied to this response page.
        sort:
          type: string
          enum:
            - knownFirstBalanceDescTokenAsc
            - legacyBalanceDescTokenAsc
          description: |
            Deterministic ordering applied to the response. Clients may page only knownFirstBalanceDescTokenAsc responses with a non-null nextCursor; legacyBalanceDescTokenAsc is a bounded, non-pageable warmup fallback with hasMore=false.
