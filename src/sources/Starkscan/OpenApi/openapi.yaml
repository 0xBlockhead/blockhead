    ProveRequest:
      type: object
      additionalProperties: false
      required:
        - block_id
        - transaction
      properties:
        block_id:
          description: Starknet block identifier forwarded to the prover unchanged.
        transaction:
          description: STRK20 transaction payload forwarded to the prover unchanged.
    ProveJobView:
      type: object
      additionalProperties: false
      required:
        - jobId
        - status
        - terminal
        - attemptCount
        - createdAt
      properties:
        jobId:
          type: string
          pattern: ^prv_[a-z0-9]{24,40}$
        status:
          type: string
          enum:
            - queued
            - dispatched
            - succeeded
            - failed
            - unavailable
            - unknown_delivery
        terminal:
          type: boolean
          description: Stop polling when true.
        attemptCount:
          type: integer
          format: int32
          minimum: 0
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        queuePosition:
          type: integer
          format: int64
          minimum: 1
        pollAfterSeconds:
          type: integer
          format: int64
          minimum: 0
        result:
          description: Prover result, passed through verbatim and available briefly after successful completion. Carries proof, proof_facts and l2_to_l1_messages, and for screened deposits also additional_data with the screening attestation. Persist the whole object on the first successful poll; a deposit is unusable on chain without additional_data.
        resultUnavailableReason:
          type: string
          enum:
            - delivered_or_expired
        error:
          type: object
          additionalProperties: true
          description: Caller-safe terminal error. unknown_delivery errors are non-retryable.
    NetworkMetricSeriesItem:
      type: object
      additionalProperties: false
      required:
        - bucketStartIso
        - bucketGranularity
        - blockCount
        - transactionCount
        - invokeTransactionCount
        - eventCount
        - l1ToL2MessageCount
        - l2ToL1MessageCount
        - activeSenderCount
        - averageTransactionsPerBlock
        - maxTransactionsPerSecond
        - latestBlockNumber
        - blockIntervalSampleCount
        - blockIntervalSecondsSum
        - averageBlockIntervalSeconds
        - maxBlockIntervalSeconds
        - actualFeeWeiTotalRaw
        - actualFeeFriTotalRaw
        - actualFeeKnownUnitCount
        - actualFeeUnclassifiedCount
        - finalizedClassDeclarationCount
        - deployedAccountCount
        - deployedContractCount
        - unclassifiedDeploymentCount
      properties:
        bucketStartIso:
          type: string
          format: date-time
        bucketGranularity:
          type: string
          enum:
            - day
            - week
            - month
          description: Calendar display resolution for this requested window.
        blockCount:
          type: integer
          format: int64
          minimum: 0
        transactionCount:
          type: integer
          format: int64
          minimum: 0
        invokeTransactionCount:
          type: integer
          format: int64
          minimum: 0
          description: Finalized Starknet INVOKE transactions. This is not an ERC-4337 user-operation count.
        eventCount:
          type: integer
          format: int64
          minimum: 0
        l1ToL2MessageCount:
          type: integer
          format: int64
          minimum: 0
        l2ToL1MessageCount:
          type: integer
          format: int64
          minimum: 0
        activeSenderCount:
          type: integer
          format: int64
          minimum: 0
        averageTransactionsPerBlock:
          type: number
          minimum: 0
        maxTransactionsPerSecond:
          type:
            - number
            - "null"
          minimum: 0
        latestBlockNumber:
          type:
            - integer
            - "null"
          format: int64
          minimum: 0
        blockIntervalSampleCount:
          type:
            - integer
            - "null"
          format: int64
          minimum: 0
          description: Positive consecutive finalized-block intervals in this bucket. Null means resource enrichment has not reached the bucket.
        blockIntervalSecondsSum:
          type:
            - number
            - "null"
          minimum: 0
          description: Approximate floating-point sum of positive finalized-block intervals in seconds for weighted aggregation. This display metric is not an exact decimal contract.
        averageBlockIntervalSeconds:
          type:
            - number
            - "null"
          minimum: 0
        maxBlockIntervalSeconds:
          type:
            - number
            - "null"
          minimum: 0
        actualFeeWeiTotalRaw:
          type:
            - string
            - "null"
          pattern: ^[0-9]+$
          description: Exact canonical receipt actual-fee total in WEI. Kept separate from FRI. Zero means a complete enriched bucket had no WEI fees; null means enrichment or expected finalized-receipt coverage is incomplete.
        actualFeeFriTotalRaw:
          type:
            - string
            - "null"
          pattern: ^[0-9]+$
          description: Exact canonical receipt actual-fee total in FRI. Kept separate from WEI. Zero means a complete enriched bucket had no FRI fees; null means enrichment or expected finalized-receipt coverage is incomplete.
        actualFeeKnownUnitCount:
          type:
            - integer
            - "null"
          format: int64
          minimum: 0
        actualFeeUnclassifiedCount:
          type:
            - integer
            - "null"
          format: int64
          minimum: 0
          description: Receipts with missing, malformed, or unsupported canonical fee data, plus expected finalized receipt rows not indexed yet.
        finalizedClassDeclarationCount:
          type:
            - integer
            - "null"
          format: int64
          minimum: 0
          description: Classes declared by finalized DECLARE transactions in this bucket. Null means adoption enrichment has not reached the bucket.
        deployedAccountCount:
          type:
            - integer
            - "null"
          format: int64
          minimum: 0
          description: Canonical deployments classified as accounts in this bucket.
        deployedContractCount:
          type:
            - integer
            - "null"
          format: int64
          minimum: 0
          description: Canonical deployments classified as non-account contracts in this bucket.
        unclassifiedDeploymentCount:
          type:
            - integer
            - "null"
          format: int64
          minimum: 0
          description: Canonical deployments whose account-versus-contract classification is not yet known.
    NetworkMetricSeriesPage:
      type: object
      additionalProperties: false
      required:
        - chainId
        - window
        - bucketGranularity
        - items
        - preparedCoverageStartIso
        - preparedCoverageEndIso
        - latestBlockNumber
        - updatedAtIso
        - source
        - metricDefinitionVersion
        - coverageStatus
        - coverageReasonCode
        - materializedThroughBlockNumber
        - sourceLatestFinalizedBlockNumber
        - replicationLagBlocks
        - resourceCoverageStatus
        - resourceCoverageReasonCode
        - resourceMaterializedThroughBlockNumber
        - resourceReplicationLagBlocks
        - adoptionCoverageStatus
        - adoptionCoverageReasonCode
        - adoptionMaterializedThroughBlockNumber
        - adoptionReplicationLagBlocks
      properties:
        chainId:
          type: string
        window:
          type: string
          enum:
            - 30d
            - 90d
            - ytd
            - all
        bucketGranularity:
          type: string
          enum:
            - day
            - week
            - month
          description: Calendar display resolution for this requested window.
        items:
          type: array
          maxItems: 9000
          items:
            $ref: "#/components/schemas/NetworkMetricSeriesItem"
        preparedCoverageStartIso:
          type:
            - string
            - "null"
          format: date-time
        preparedCoverageEndIso:
          type:
            - string
            - "null"
          format: date-time
        latestBlockNumber:
          type:
            - integer
            - "null"
          format: int64
          minimum: 0
        updatedAtIso:
          type:
            - string
            - "null"
          format: date-time
        source:
          type: string
          enum:
            - finalized_materialized_buckets
          description: Serving source. This route reads prepared finalized buckets, not raw chain facts.
        metricDefinitionVersion:
          type: string
          enum:
            - network_metrics_v3
          description: Version of the checked-in metric definition.
        coverageStatus:
          type: string
          enum:
            - prepared
            - partial
            - unavailable
          description: Whether the prepared materialization covers the latest finalized source block.
        coverageReasonCode:
          type: string
          enum:
            - finalized_materialized_buckets
            - materializer_lagging
            - materializer_state_unavailable
            - materialized_ahead_of_source_tip
            - no_prepared_buckets
            - source_tip_unavailable
          description: Machine-readable explanation of the coverage status. A prepared response requires the global materializer watermark to match the observed finalized source tip.
        materializedThroughBlockNumber:
          type:
            - integer
            - "null"
          format: int64
          minimum: 0
          description: Latest finalized block incorporated by the prepared materializer when known.
        sourceLatestFinalizedBlockNumber:
          type:
            - integer
            - "null"
          format: int64
          minimum: 0
          description: Latest finalized source block observed by the read store when known.
        replicationLagBlocks:
          type:
            - integer
            - "null"
          format: int64
          minimum: 0
          description: Difference between the source finalized tip and materialized watermark. Zero means current.
        resourceCoverageStatus:
          type: string
          enum:
            - prepared
            - partial
            - unavailable
          description: Independent coverage state for finalized block timing and canonical receipt fees.
        resourceCoverageReasonCode:
          type: string
          enum:
            - finalized_resource_buckets
            - no_prepared_resource_buckets
            - resource_metrics_not_materialized
            - resource_metrics_partial_window
            - resource_receipts_incomplete
            - resource_materializer_lagging
            - resource_materializer_state_unavailable
            - resource_materialized_ahead_of_source_tip
            - source_tip_unavailable
        resourceMaterializedThroughBlockNumber:
          type:
            - integer
            - "null"
          format: int64
          minimum: 0
        resourceReplicationLagBlocks:
          type:
            - integer
            - "null"
          format: int64
          minimum: 0
        adoptionCoverageStatus:
          type: string
          enum:
            - prepared
            - partial
            - unavailable
          description: Independent coverage state for finalized declarations and canonical deployments.
        adoptionCoverageReasonCode:
          type: string
          enum:
            - finalized_adoption_buckets
            - no_prepared_adoption_buckets
            - adoption_metrics_not_materialized
            - adoption_metrics_partial_window
            - adoption_materializer_lagging
            - adoption_materializer_state_unavailable
            - adoption_materialized_ahead_of_source_tip
            - source_tip_unavailable
        adoptionMaterializedThroughBlockNumber:
          type:
            - integer
            - "null"
          format: int64
          minimum: 0
        adoptionReplicationLagBlocks:
          type:
            - integer
            - "null"
          format: int64
          minimum: 0
    WalletProviderMetricItem:
      type: object
      additionalProperties: false
      required:
        - providerFamily
        - providerLabel
        - knownDeployedAccountCount
        - activeAccount30dCount
        - pricedFungibleValueUsd
        - pricedAccountCount
        - unpricedBalanceAccountCount
        - accountsOver10Usd
        - accountsOver100Usd
        - accountsOver1000Usd
        - classificationSource
      properties:
        providerFamily:
          type: string
          description: Stable machine-readable wallet-provider origin family.
        providerLabel:
          type: string
          description: Human-readable wallet-provider label.
        knownDeployedAccountCount:
          type: integer
          format: int64
          minimum: 0
          description: Distinct recognized wallet-provider deployment origins. Canonical deployment facts or finalized immutable deployment-class evidence is sufficient even when the derived address-activity summary has not been populated yet.
        activeAccount30dCount:
          type: integer
          format: int64
          minimum: 0
          description: Classified accounts that sent a successful finalized transaction in the trailing 30 days.
        pricedFungibleValueUsd:
          type: string
          pattern: ^[0-9]+(?:\.[0-9]+)?$
          description: Lower-bound USD value as a decimal string to avoid JavaScript precision loss.
        pricedAccountCount:
          type: integer
          format: int64
          minimum: 0
        unpricedBalanceAccountCount:
          type: integer
          format: int64
          minimum: 0
        accountsOver10Usd:
          type: integer
          format: int64
          minimum: 0
          description: Accounts whose priced finalized fungible balance is strictly greater than 10 USD.
        accountsOver100Usd:
          type: integer
          format: int64
          minimum: 0
          description: Accounts whose priced finalized fungible balance is strictly greater than 100 USD.
        accountsOver1000Usd:
          type: integer
          format: int64
          minimum: 0
          description: Accounts whose priced finalized fungible balance is strictly greater than 1,000 USD.
        classificationSource:
          type: string
          enum:
            - deployment_origin_with_current_class_fallback
    WalletImplementationMetricItem:
      type: object
      additionalProperties: false
      required:
        - implementationFamily
        - implementationLabel
        - knownAccountCount
        - classificationSource
