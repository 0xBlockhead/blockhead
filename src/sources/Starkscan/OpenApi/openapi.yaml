openapi: 3.1.0
info:
  title: Starkscan Explorer API
  version: 2.0.0
  description: Breaking Starkscan rename of the previous public explorer contract for external integrators, SDKs, CLI workflows, and direct API integrations, including selected advanced utility routes. Clients generated from older artifacts must switch to the Starkscan discovery path, auth header, vendor extensions, and schema identifiers.
servers:
  - url: https://api.starkscan.co
    description: Hosted external Starkscan API base. Requests execute against /v1/* on the API host; app-host /api/v1/* remains compatibility.
security:
  - StarkscanApiKey: []
paths:
  /.well-known/starkscan-agent.json:
    get:
      summary: Agent-readable Starkscan memory contract
      description: Public machine-readable discovery document for agents. It points agents at the authenticated meta routes, route families, operating rules, and typed artifact contract without requiring chat history.
      servers:
        - url: /
          description: Same-host public well-known discovery root
      security:
        - {}
      responses:
        "200":
          description: Agent-readable discovery and operating contract
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentMemoryContract"
      x-starkscan-audience: public-core
      x-starkscan-certification: certified
      x-starkscan-stability: stable
      x-starkscan-surface-tier: official-public-api
      x-starkscan-key-tier: public
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      tags:
        - Reference
  /v1/meta/capabilities:
    get:
      summary: Agent-readable API capabilities
      description: Authenticated route-family catalog for agents and developers. Hosted external clients call `/v1/meta/capabilities` with `X-Starkscan-Api-Key`. Same-origin explorer traffic uses this `/v1` route through the trusted edge. Use this before selecting the smallest route set for a task.
      security:
        - StarkscanApiKey: []
      responses:
        "200":
          description: Capability and route-family catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaCapabilitiesView"
        "401":
          $ref: "#/components/responses/UnauthorizedText"
        "403":
          $ref: "#/components/responses/ForbiddenText"
        "429":
          $ref: "#/components/responses/RateLimited"
      x-starkscan-audience: public-core
      x-starkscan-certification: beta
      x-starkscan-stability: stable
      x-starkscan-surface-tier: official-public-api
      x-starkscan-key-tier: read
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      tags:
        - Reference
  /v1/meta/chains:
    get:
      summary: Supported chain ids for this deployment
      description: Authenticated chain catalog. Hosted external clients call `/v1/meta/chains` with `X-Starkscan-Api-Key`. Same-origin explorer traffic uses this `/v1` route through the trusted edge.
      security:
        - StarkscanApiKey: []
      responses:
        "200":
          description: Supported chain metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaChainsView"
        "401":
          $ref: "#/components/responses/UnauthorizedText"
        "403":
          $ref: "#/components/responses/ForbiddenText"
        "429":
          $ref: "#/components/responses/RateLimited"
      x-starkscan-audience: public-core
      x-starkscan-certification: beta
      x-starkscan-stability: stable
      x-starkscan-surface-tier: official-public-api
      x-starkscan-key-tier: read
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      tags:
        - Reference
  /v1/meta/agent-context:
    get:
      summary: Full agent context contract
      description: Authenticated context document that combines the public agent-memory contract with handoff artifact guidance. Hosted external clients call `/v1/meta/agent-context` with `X-Starkscan-Api-Key`. Same-origin explorer traffic uses this `/v1` route through the trusted edge.
      security:
        - StarkscanApiKey: []
      responses:
        "200":
          description: Full agent context contract
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaAgentContextView"
        "401":
          $ref: "#/components/responses/UnauthorizedText"
        "403":
          $ref: "#/components/responses/ForbiddenText"
        "429":
          $ref: "#/components/responses/RateLimited"
      x-starkscan-audience: public-core
      x-starkscan-certification: beta
      x-starkscan-stability: stable
      x-starkscan-surface-tier: official-public-api
      x-starkscan-key-tier: read
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      tags:
        - Reference
  /v1/{chain}/status:
    get:
      summary: Chain status
      security:
        - StarkscanApiKey: []
      parameters:
        - $ref: "#/components/parameters/ChainParam"
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Current indexed and finalized head status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExplorerStatusView"
        "401":
          $ref: "#/components/responses/UnauthorizedText"
        "403":
          $ref: "#/components/responses/ForbiddenText"
        "429":
          $ref: "#/components/responses/RateLimited"
      x-starkscan-audience: public-core
      x-starkscan-certification: certified
      x-starkscan-stability: stable
      x-starkscan-surface-tier: official-public-api
      x-starkscan-key-tier: read
      tags:
        - Status
  /v1/{chain}/status/indexing-freshness:
    get:
      summary: Indexing freshness health
      description: Fail-closed semantic health check for external monitoring. Compares one bounded live Starknet RPC head lookup with Starkscan's indexed read-model watermark. Returns HTTP 200 only when both facts are available, internally consistent, and no more than 20 blocks apart; otherwise returns HTTP 503. This endpoint evaluates Starkscan indexing freshness only and does not attribute a failure to Starknet or an upstream provider. The chain path parameter must match the chain served by the deployment; other chains return HTTP 404 without querying an RPC.
      security: []
      parameters:
        - $ref: "#/components/parameters/ChainParam"
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Starkscan indexing is within the monitored freshness threshold
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexingFreshnessHealthView"
        "404":
          description: Chain is not served by this deployment.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/IndexingFreshnessDegraded"
      x-starkscan-audience: public-core
      x-starkscan-certification: beta
      x-starkscan-stability: stable
      x-starkscan-surface-tier: official-public-api
      x-starkscan-key-tier: public
      tags:
        - Status
  /v1/{chain}/rpc:
    post:
      summary: Starknet JSON-RPC gateway
      description: Bounded Starknet JSON-RPC gateway. Read methods are forwarded through Starkscan's rate-limited upstream pool; write methods remain gated by the RPC pilot controls. Accepts a single JSON-RPC request object or a batch of up to 25 request objects. JSON parse errors and invalid JSON-RPC payloads are returned as JSON-RPC error envelopes with HTTP 200 so clients can keep standard JSON-RPC handling.
      security:
        - StarkscanApiKey: []
      parameters:
        - $ref: "#/components/parameters/ChainParam"
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/JsonRpcRequest"
                - $ref: "#/components/schemas/JsonRpcBatchRequest"
      responses:
        "200":
          description: JSON-RPC response or JSON-RPC error envelope forwarded from the gateway
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/JsonRpcResponse"
                  - $ref: "#/components/schemas/JsonRpcBatchResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedText"
        "403":
          $ref: "#/components/responses/ForbiddenText"
        "429":
          $ref: "#/components/responses/RateLimited"
      x-starkscan-audience: public-core
      x-starkscan-certification: beta
      x-starkscan-stability: stable
      x-starkscan-surface-tier: advanced-utility
      x-starkscan-key-tier: utility
      tags:
        - Reference
  /v1/{chain}/rpc/ws:
    get:
      summary: Starknet JSON-RPC WebSocket proxy
      description: Beta WebSocket upgrade route for Starknet JSON-RPC subscription clients. The route is disabled unless the deployment explicitly enables `RPC_WSS_ENABLED` and configures a Starknet WebSocket upstream. After a successful protocol upgrade, clients send and receive Starknet JSON-RPC subscription messages over the WebSocket connection. This lane is certified separately from the HTTP JSON-RPC gateway.
      security:
        - StarkscanApiKey: []
      parameters:
        - $ref: "#/components/parameters/ChainParam"
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "101":
          description: WebSocket protocol upgrade accepted.
        "401":
          $ref: "#/components/responses/UnauthorizedText"
        "403":
          $ref: "#/components/responses/ForbiddenText"
        "404":
          description: Chain is not served by this deployment.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-starkscan-audience: public-core
      x-starkscan-certification: beta
      x-starkscan-stability: stable
      x-starkscan-surface-tier: advanced-utility
      x-starkscan-key-tier: utility
      tags:
        - Reference
  /v1/{chain}/block/{number_or_hash}:
    get:
      summary: Block detail by number or hash
      security:
        - StarkscanApiKey: []
      parameters:
        - $ref: "#/components/parameters/ChainParam"
        - name: number_or_hash
          in: path
          required: true
          schema:
            type: string
          example: "7550747"
        - name: tx_limit
          in: query
          description: Max block transactions returned (clamped to 1..200). Defaults to `50` when omitted.
          schema:
            type: integer
            format: int32
            default: 50
            minimum: 1
            maximum: 200
          example: 50
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Block detail with transaction preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockView"
        "401":
          $ref: "#/components/responses/UnauthorizedText"
        "403":
          $ref: "#/components/responses/ForbiddenText"
        "404":
          description: Block not found
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: The requested Sepolia block was intentionally removed by the rolling indexed-history policy.
          headers:
            X-Request-Id:
              description: Canonical request correlation header for support and tracing.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryExpiredErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
      x-starkscan-audience: public-core
      x-starkscan-certification: certified
      x-starkscan-stability: stable
      x-starkscan-surface-tier: official-public-api
      x-starkscan-key-tier: read
      tags:
        - Blocks
  /v1/{chain}/block-at-timestamp:
    get:
      summary: Resolve timestamp to indexed block
      description: Resolve a Unix seconds or RFC3339 timestamp to the closest indexed Starknet block. `closest=before` is the default and is the right choice for accounting "as of" balance snapshots such as calendar close. The route is served from indexed block facts only; RPC is used by the correctness gate, not by the request path.
      security:
        - StarkscanApiKey: []
      parameters:
        - $ref: "#/components/parameters/ChainParam"
        - name: timestamp
          in: query
          required: true
          description: Unix seconds or RFC3339 timestamp with timezone.
          schema:
            oneOf:
              - type: string
                pattern: ^[0-9]{1,19}$
                description: Unix seconds.
              - type: string
                format: date-time
                maxLength: 96
                description: RFC3339 timestamp with timezone.
          example: 2025-12-31T23:59:59Z
        - name: closest
          in: query
          description: |
            Direction for the selected block. `before` returns the last indexed block at or before the timestamp; `after` returns the first indexed block at or after the timestamp.
          schema:
            type: string
            enum:
              - before
              - after
            default: before
          example: before
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Timestamp resolution with inclusive indexed bounds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockAtTimestampView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/UnauthorizedText"
        "403":
          $ref: "#/components/responses/ForbiddenText"
        "404":
          description: No indexed block exists in the requested closest direction
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          $ref: "#/components/responses/HistoryExpired"
        "429":
          $ref: "#/components/responses/RateLimited"
      x-starkscan-audience: public-core
      x-starkscan-certification: certified
      x-starkscan-stability: stable
      x-starkscan-surface-tier: official-public-api
      x-starkscan-key-tier: read
      tags:
        - Blocks
  /v1/{chain}/blocks:
    get:
      summary: Paginated latest blocks feed
      security:
        - StarkscanApiKey: []
      parameters:
        - $ref: "#/components/parameters/ChainParam"
        - name: cursor
          in: query
          description: Optional block number cursor for reverse pagination.
          schema:
            type: integer
            format: int64
            minimum: 0
          example: 8279910
        - name: limit
          in: query
          description: Page size (clamped to 1..200). Defaults to `25` when omitted.
          schema:
            type: integer
            format: int32
            default: 25
            minimum: 1
            maximum: 200
          example: 25
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Chain blocks page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChainBlockListPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/UnauthorizedText"
        "403":
          $ref: "#/components/responses/ForbiddenText"
        "410":
          $ref: "#/components/responses/HistoryExpired"
        "429":
          $ref: "#/components/responses/RateLimited"
      x-starkscan-audience: public-core
      x-starkscan-certification: beta
      x-starkscan-stability: stable
      x-starkscan-surface-tier: official-public-api
      x-starkscan-key-tier: read
      tags:
        - Blocks
  /v1/{chain}/block/{number}/txs:
    get:
      summary: Paginated transactions for one block
      security:
        - StarkscanApiKey: []
      parameters:
        - $ref: "#/components/parameters/ChainParam"
        - name: number
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 8279910
        - name: cursor
          in: query
          description: Optional transaction index cursor for reverse pagination.
          schema:
            type: integer
            format: int32
            minimum: 0
          example: 0
        - name: limit
          in: query
          description: Page size (clamped to 1..100). Defaults to `25` when omitted.
          schema:
            type: integer
            format: int32
            default: 25
            minimum: 1
            maximum: 100
          example: 25
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Block transaction page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockTransactionPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/UnauthorizedText"
        "403":
          $ref: "#/components/responses/ForbiddenText"
        "404":
          description: Block not found
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          $ref: "#/components/responses/HistoryExpired"
        "429":
          $ref: "#/components/responses/RateLimited"
      x-starkscan-audience: public-core
      x-starkscan-certification: beta
      x-starkscan-stability: stable
      x-starkscan-surface-tier: official-public-api
      x-starkscan-key-tier: read
      tags:
        - Blocks
  /v1/{chain}/tx/previews:
    post:
      summary: Batch transaction previews by hash
      security:
        - StarkscanApiKey: []
      parameters:
        - $ref: "#/components/parameters/ChainParam"
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionPreviewBatchRequest"
      responses:
        "200":
          description: Ordered transaction preview results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionPreviewBatchView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/UnauthorizedText"
        "403":
          $ref: "#/components/responses/ForbiddenText"
        "410":
          $ref: "#/components/responses/HistoryExpired"
        "429":
          $ref: "#/components/responses/RateLimited"
      x-starkscan-audience: public-core
      x-starkscan-certification: beta
      x-starkscan-stability: stable
      x-starkscan-surface-tier: advanced-utility
      x-starkscan-key-tier: utility
      description: Advanced utility route. This helper is externally supported, but it requires a broader utility-access key than the baseline read tier and is not the default starting point for new integrations.
      tags:
        - Utilities
  /v1/{chain}/tx/{tx_hash}:
    get:
      summary: Transaction detail by hash
      security:
        - StarkscanApiKey: []
      parameters:
        - $ref: "#/components/parameters/ChainParam"
        - name: tx_hash
          in: path
          required: true
          schema:
            type: string
          example: "0x054bfd961fb8b156c77ffa0f7882b8fcc1836753c2d3d88435b640d6300c8bd9"
        - name: logLimit
          in: query
          description: Maximum number of event logs returned in the transaction detail payload. Defaults to `96` when omitted.
          schema:
            type: integer
            format: int32
            default: 96
            minimum: 1
            maximum: 256
          example: 96
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Transaction detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionDetailView"
        "401":
          $ref: "#/components/responses/UnauthorizedText"
        "403":
          $ref: "#/components/responses/ForbiddenText"
        "404":
          description: Transaction not found
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: The requested Sepolia transaction was intentionally removed by the rolling indexed-history policy.
          headers:
            X-Request-Id:
              description: Canonical request correlation header for support and tracing.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryExpiredErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
      x-starkscan-audience: public-core
      x-starkscan-certification: certified
      x-starkscan-stability: stable
      x-starkscan-surface-tier: official-public-api
      x-starkscan-key-tier: read
      tags:
        - Transactions
  /v1/{chain}/txs:
    get:
      summary: Paginated latest transactions feed
      security:
        - StarkscanApiKey: []
      parameters:
        - $ref: "#/components/parameters/ChainParam"
        - name: cursor
          in: query
          description: Optional cursor encoded as `block:tx`.
          schema:
            type: string
        - name: limit
          in: query
          description: Page size (clamped to 1..200).
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Chain transactions page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChainTransactionListPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/UnauthorizedText"
        "403":
          $ref: "#/components/responses/ForbiddenText"
        "410":
          $ref: "#/components/responses/HistoryExpired"
        "429":
          $ref: "#/components/responses/RateLimited"
      x-starkscan-audience: public-core
      x-starkscan-certification: beta
      x-starkscan-stability: stable
      x-starkscan-surface-tier: official-public-api
      x-starkscan-key-tier: read
      tags:
        - Transactions
  /v1/{chain}/messages:
    get:
      summary: Paginated canonical cross-layer messages
      description: Global cross-layer message feed served only from indexed StarknetCore protocol message facts. Rows are keyed by protocol message hash, not token-transfer or bridge-adapter activity. Coverage metadata is explicit because a data plane may still be backfilling protocol message facts.
      security:
        - StarkscanApiKey: []
      parameters:
        - $ref: "#/components/parameters/ChainParam"
        - name: direction
          in: query
          description: Optional message direction filter.
          schema:
            type: string
            enum:
              - all
              - l1_to_l2
              - l2_to_l1
        - name: txHash
          in: query
          description: Optional transaction hash filter.
          schema:
            type: string
            pattern: ^0[xX][0-9a-fA-F]{1,64}$
        - name: messageHash
          in: query
          description: Optional protocol message hash filter.
          schema:
            type: string
            pattern: ^0[xX][0-9a-fA-F]{1,64}$
        - name: cursor
          in: query
          description: |
            Optional opaque cursor returned unchanged from `nextCursor`. New responses use `m1:block:tx:message:tx_hash:message_hash:direction:source_tier` so pagination remains stable when multiple messages share the same numeric tuple. Legacy `block:tx:message` cursors remain accepted for older clients.
          schema:
            type: string
            pattern: ^(m1:[0-9]+:[0-9]+:[0-9]+:0[xX][0-9a-fA-F]+:0[xX][0-9a-fA-F]+:(l1_to_l2|l2_to_l1):(head|finalized)|[0-9]+:[0-9]+:[0-9]+)$
        - name: limit
          in: query
          description: Page size (defaults to the full bounded pool directory page; clamped to 1..100).
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 100
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Global message page with explicit coverage metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/UnauthorizedText"
        "403":
          $ref: "#/components/responses/ForbiddenText"
        "429":
          $ref: "#/components/responses/RateLimited"
      x-starkscan-audience: public-core
      x-starkscan-certification: beta
      x-starkscan-stability: stable
      x-starkscan-surface-tier: official-public-api
      x-starkscan-key-tier: read
      tags:
        - Reference
  /v1/{chain}/tx/{tx_hash}/trace:
    get:
      summary: Transaction Cairo trace by hash
      security:
        - StarkscanApiKey: []
      parameters:
        - $ref: "#/components/parameters/ChainParam"
        - name: tx_hash
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Transaction trace payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractTransactionTraceView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/UnauthorizedText"
        "403":
          $ref: "#/components/responses/ForbiddenText"
        "404":
          description: Transaction trace not found
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
