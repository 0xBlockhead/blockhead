x-starkscan-audience: public-core
tags:
  - name: Account
    description: Session-authenticated self-serve API-key lifecycle and usage routes for workspace operators.
  - name: Addresses
  - name: Blocks
  - name: Contracts
  - name: Privacy Pool
    description: Beta indexed public activity, note evidence, prepared metrics, and finalized public-flow amounts. These routes never infer private ownership or note linkage.
  - name: Reference
    description: Low-level explorer read surfaces that stay public but sit outside the default block/transaction/address entrypoints.
  - name: Search
  - name: Status
  - name: Tokens
  - name: Transactions
  - name: Utilities
    description: Supported helper routes that remain external, but are not the default public API starting point and can require broader utility-access keys.
