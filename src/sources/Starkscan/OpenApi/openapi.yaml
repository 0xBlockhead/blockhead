        `complete` means the holdings snapshot is complete enough for portfolio parity checks. Other values are useful evidence but not exact portfolio ground truth. `lagBlocks` is populated when incompleteness can be attributed to indexed-source lag.
    AddressTokenHoldingsCompletenessView:
      type: object
      additionalProperties: false
      required:
        - exact
        - truncated
        - complete
        - reasonCode
        - reason
        - lagBlocks
        - capped
        - cap
      properties:
        exact:
          type: boolean
          description: Mirrors the top-level `exact` field.
        truncated:
          type: boolean
          description: Mirrors the top-level `truncated` field.
        complete:
          type: boolean
          description: |
            True only when the response is exact, not truncated, and `reasonCode=complete`.
        reasonCode:
          $ref: "#/components/schemas/TokenHoldingsCompletenessReasonCode"
        reason:
          type: string
          description: Human-readable explanation for the current completeness state.
        lagBlocks:
          type:
            - integer
            - "null"
          format: int64
          description: Indexed lag in blocks when known. Null means the route cannot attribute lag for this response.
        capped:
          type: boolean
          description: True when a response cap affected the result.
        cap:
          type:
            - integer
            - "null"
          format: int32
          description: Effective response cap when capped, otherwise null.
    AddressTokenHoldingsView:
      type: object
      additionalProperties: false
      required:
