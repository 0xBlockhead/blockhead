        - deploymentClassHash
        - classHashSource
        - classHashAsOfBlock
        - classHashAsOfBlockHash
        - classHashFinality
        - classLabel
        - classLabelSource
        - isAccount
        - createdOnIso
        - deployedAtTxHash
        - deployedByAddress
        - hasReceivedFunds
