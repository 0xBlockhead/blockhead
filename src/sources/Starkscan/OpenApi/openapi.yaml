    TokenHolderSnapshot:
      type: object
      description: |
        Identity, provenance, and observable freshness for one holder population. `generationId`, `asOfBlockHash`, `rowDigest`, `expiresAt`, `updatedAt`, and `lagBlocks` are optional for legacy compatibility, but all six are present together for immutable complete-population and Top-N screening generations. Pages in one cursor walk preserve the generation identity. Analytics comparisons use `generationId`, block/hash, and `rowDigest`; `expiresAt` is a response-specific continuation deadline. `updatedAt` records publication time and `lagBlocks` compares the pinned snapshot to the indexed finalized head observed for this response. Clients must not fabricate an omitted field.
      additionalProperties: false
      required:
        - asOfBlock
        - source
        - freshness
      properties:
        asOfBlock:
          type:
            - integer
            - "null"
          format: int64
          minimum: 0
          description: Finalized generation block number when generation-bound; nullable for a missing or legacy snapshot.
        asOfBlockHash:
          type: string
          pattern: ^0[xX][0-9a-fA-F]{1,64}$
          description: Exact finalized block hash for an immutable generation.
        generationId:
          type: integer
          format: int64
          minimum: 1
          description: Server-assigned immutable holder generation identifier.
        rowDigest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
          description: SHA-256 identity of the complete ordered holder row population. It is response evidence, not a cursor field clients should construct.
        expiresAt:
          type: string
          format: date-time
          description: Retention deadline through which continuation cursors for this immutable generation can be served. The service default is six hours, but this timestamp is authoritative.
        updatedAt:
          type: string
          format: date-time
          description: Time at which this immutable generation was published and became available for reads.
        lagBlocks:
          type: integer
          format: int64
          minimum: 0
          description: Difference between the indexed finalized head observed for this response and the generation snapshot block.
        source:
          type: string
          enum:
            - materialized_fungible_balances
            - sealed_finalized_holder_generation
            - sealed_finalized_holder_screening_projection
        freshness:
          type: string
          enum:
            - head_plus_finalized
            - analytics_snapshot
            - finalized_generation
            - finalized_screening_generation
      allOf:
        - if:
            properties:
              source:
                const: sealed_finalized_holder_generation
            required:
              - source
          then:
            required:
              - asOfBlockHash
              - generationId
              - rowDigest
              - expiresAt
              - updatedAt
              - lagBlocks
            properties:
              asOfBlock:
                type: integer
                format: int64
                minimum: 0
              freshness:
                const: finalized_generation
        - if:
            properties:
              source:
                const: sealed_finalized_holder_screening_projection
            required:
              - source
          then:
            required:
              - asOfBlockHash
              - generationId
              - rowDigest
              - expiresAt
              - updatedAt
              - lagBlocks
            properties:
              asOfBlock:
                type: integer
                format: int64
                minimum: 0
              freshness:
                const: finalized_screening_generation
    TokenHolderScreeningSnapshot:
      allOf:
        - $ref: "#/components/schemas/TokenHolderSnapshot"
        - type: object
          required:
            - asOfBlock
            - asOfBlockHash
            - generationId
            - rowDigest
            - expiresAt
            - updatedAt
            - lagBlocks
            - source
            - freshness
          properties:
            asOfBlock:
              type: integer
              format: int64
              minimum: 0
            source:
              const: sealed_finalized_holder_screening_projection
            freshness:
              const: finalized_screening_generation
    TokenHolderCompleteness:
      type: object
      additionalProperties: false
      oneOf:
        - properties:
            populationComplete:
              const: true
            populationReasonCode:
              const: complete_canonical_transfer_coverage
        - properties:
            populationComplete:
              const: false
            populationReasonCode:
              const: population_coverage_unproven
      required:
        - populationComplete
        - populationReasonCode
        - exact
        - truncated
        - reasonCode
      properties:
        populationComplete:
          type: boolean
          description: |
            Whether Starkscan has established that the generation represents the token's full holder population. This is independent of cursor pagination and sampled `balanceOf` checks. A full cursor walk with this field set to `false` is only a complete walk of the published subset, not a complete ownership population.
        populationReasonCode:
          type: string
          description: |
            Population-coverage evidence state. `complete_canonical_transfer_coverage` requires canonical transfer coverage and generation-bound reconstruction. `population_coverage_unproven` means the returned rows are useful indexed evidence but must not be used to make a complete-holder or supply-concentration claim.
          enum:
            - complete_canonical_transfer_coverage
            - population_coverage_unproven
        exact:
          type: boolean
          description: |
            Correctness of the complete holder generation, not coverage of the current page. True only when certification binds the exact chain, token, generation, finalized block number/hash, and row digest.
        truncated:
          type: boolean
          description: |
            True only when the holder evidence/result was capped before a complete snapshot could be represented. Normal pagination is represented by `nextCursor` and does not make this field true; immutable holder pages therefore remain `truncated=false` while more pages exist.
        reasonCode:
          type: string
          description: |
            Completeness and certification reason for the holder generation. It is always present and must be interpreted alongside `exact`; `materialized_snapshot`, for example, can accompany `exact=true`. `cursor_snapshot_drift` means the cursor no longer matches the served snapshot identity; restart the holder walk from the first page rather than retrying or combining pages from that cursor.
          enum:
            - materialized_snapshot
            - uncertified_materialized_snapshot
            - certification_not_run
            - certification_table_missing
            - revoked
            - stale
            - unavailable
            - audit_failed
            - cursor_snapshot_drift
    TokenHolderCertification:
      description: |
        Certification state for the complete holder generation. `validatedAgainst=starknet_rpc_balanceOf` means bounded deterministic balances were sampled at the exact snapshot block. RPC does not enumerate holders and is not the population-completeness authority; exactness also requires complete canonical transfer coverage and generation-bound ledger reconstruction.
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - status
            - validatedAgainst
            - checkedAt
            - reasonCode
          properties:
            status:
              type: string
              enum:
                - certified
            validatedAgainst:
              type: string
              enum:
                - starknet_rpc_balanceOf
              description: Bounded exact-block balance sample oracle, not a holder enumeration source.
            checkedAt:
              type: string
              format: date-time
            reasonCode:
              type: string
              enum:
                - materialized_snapshot
        - type: object
          additionalProperties: false
          required:
            - status
            - validatedAgainst
            - checkedAt
            - reasonCode
          properties:
            status:
              type: string
              enum:
                - uncertified
            validatedAgainst:
              type:
                - string
                - "null"
              enum:
                - starknet_rpc_balanceOf
                - null
            checkedAt:
              type:
                - string
                - "null"
              format: date-time
            reasonCode:
              type: string
              enum:
                - uncertified_materialized_snapshot
                - certification_not_run
                - certification_table_missing
        - type: object
          additionalProperties: false
          required:
            - status
            - validatedAgainst
            - checkedAt
            - reasonCode
          properties:
            status:
              type: string
              enum:
                - revoked
            validatedAgainst:
              type:
                - string
                - "null"
              enum:
                - starknet_rpc_balanceOf
                - null
            checkedAt:
              type:
                - string
                - "null"
              format: date-time
            reasonCode:
              type: string
              enum:
                - revoked
        - type: object
          additionalProperties: false
          required:
            - status
            - validatedAgainst
            - checkedAt
            - reasonCode
          properties:
            status:
              type: string
              enum:
                - stale
            validatedAgainst:
              type:
                - string
                - "null"
              enum:
