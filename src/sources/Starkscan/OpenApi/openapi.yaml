        pricedTokenCount:
          type: integer
          format: int64
          minimum: 0
        unpricedTokenCount:
          type: integer
          format: int64
          minimum: 0
        classificationSource:
          type: string
        sourceLatestFinalizedBlockNumber:
          type:
            - integer
            - "null"
          format: int64
          minimum: 0
        materializedThroughBlockNumber:
          type:
            - integer
            - "null"
          format: int64
          minimum: 0
        replicationLagBlocks:
          type:
            - integer
            - "null"
          format: int64
          minimum: 0
        coverageStatus:
          type: string
          enum:
            - prepared
            - partial
            - unavailable
        coverageReasonCode:
          type: string
          enum:
            - finalized_materialized_snapshot
            - materializer_stale
            - materializer_state_unavailable
            - materialized_ahead_of_source_tip
            - no_prepared_snapshot
            - source_contract_mismatch
            - source_tip_unavailable
        metricDefinitionVersion:
          type: string
          enum:
            - wallet_provider_metrics_v1
            - wallet_provider_metrics_v2
            - wallet_provider_metrics_v3
            - wallet_provider_metrics_v4
        source:
          type: string
          enum:
            - finalized_materialized_snapshot
        caveat:
          type: string
        updatedAtIso:
          type:
            - string
            - "null"
          format: date-time
