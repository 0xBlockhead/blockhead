        chainId:
          type: string
        ownerAddress:
          type: string
        requestId:
          type: string
        block:
          $ref: "#/components/schemas/WalletStateBlock"
        scope:
          type: string
          enum:
            - explicit
            - discovered
            - discovered_plus_registry
          description: |
            `discovered` uses wallet-observed candidates only. `discovered_plus_registry` also evaluates the curated registry and can require pagination even when no wallet-observed asset exists.
        coverage:
          $ref: "#/components/schemas/WalletAssetDiscoveryCoverage"
        correctness:
          type: string
          enum:
            - verified_complete
            - verified_partial
        partial:
          type: boolean
        walletSafe:
          type: boolean
          description: True only when verification is complete, the page has no continuation, and discovery is complete within its declared scope.
        items:
          type: array
          maxItems: 25
          items:
            $ref: "#/components/schemas/WalletStateAsset"
        verification:
          $ref: "#/components/schemas/WalletStateVerification"
        accountState:
          $ref: "#/components/schemas/WalletStateAccountState"
        valuation:
          $ref: "#/components/schemas/WalletStateValuation"
        hasMore:
          type: boolean
        nextCursor:
          type:
            - string
            - "null"
