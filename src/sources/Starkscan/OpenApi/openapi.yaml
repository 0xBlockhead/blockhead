            sourceProvenance:
              const: null
            totalPrivateActionTxCount:
              const: null
            totalHelperWithdrawalEventCount:
              const: null
            totalNoteUsedEventCount:
              const: null
            totalOpenNoteDepositedEventCount:
              const: null
            metrics:
