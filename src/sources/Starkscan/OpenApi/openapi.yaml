      description: |
        One caller-eligible operation from the runtime correctness manifest. Use openapiOperationRef against MetaCapabilitiesView.documentation.openapiUrl as a URI fragment, percent-decode the fragment once, then use the resulting JSON Pointer to retrieve parameters, request bodies, response schemas, and examples.
      properties:
