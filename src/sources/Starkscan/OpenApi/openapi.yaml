        implementationFamily:
          type: string
          description: Stable machine-readable current account-code lineage.
        implementationLabel:
          type: string
          description: Human-readable current account-code lineage label.
        knownAccountCount:
          type: integer
          format: int64
          minimum: 0
        classificationSource:
          type: string
          enum:
            - finalized_current_class
    WalletProviderMetricPage:
      type: object
      additionalProperties: false
      required:
        - chainId
        - items
        - implementationItems
        - sourceKnownAccountCount
        - trackedProviderAccountCount
        - trackedProviderAccountSharePercent
        - pricedTokenCount
        - unpricedTokenCount
        - classificationSource
        - sourceLatestFinalizedBlockNumber
        - materializedThroughBlockNumber
        - replicationLagBlocks
        - coverageStatus
        - coverageReasonCode
        - metricDefinitionVersion
        - source
        - caveat
        - updatedAtIso
      properties:
        chainId:
          type: string
        items:
          type: array
          maxItems: 16
          items:
            $ref: "#/components/schemas/WalletProviderMetricItem"
