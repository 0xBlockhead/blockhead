        totalActivityCount:
          type: integer
          format: int64
        activityCountExact:
          type:
            - boolean
            - "null"
          description: |
            True when the returned activity count is complete for the indexed summary windows used by this response. False means the batch route intentionally returned bounded indexed metadata without cold repair or raw activity scans.
