          type: string
          example: "#/paths/~1v1~1%7Bchain%7D~1status/get"
        rateLimitClass:
          type: string
          enum:
            - light
            - heavy
            - batch
          description: Value returned in `X-Starkscan-Route-Class` for this operation. Use it with the rate-limit response headers for class-specific backoff.
