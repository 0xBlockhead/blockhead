    PositionalEventSearchCapability:
      type: object
      additionalProperties: false
      required:
        - chain
        - positions
        - bounded
        - fullRange
      description: |
        Caller-specific positional event-search contract. The bounded path is available to ordinary read callers. External full-range search additionally requires a DB-backed Wallet workspace; the authenticated loopback internal operator lane is also entitled. Both paths require certified contiguous index coverage for every requested selector at one common non-zero anchor position. The server chooses the populated position with the fewest requested values, breaking ties by lower position number. Additional populated later positions are applied to those anchor candidates and do not need separate coverage; entitlement alone never makes incomplete index data serveable.
      properties:
        chain:
          type: string
        positions:
          type: object
          additionalProperties: false
          required:
            - minimum
            - maximum
          properties:
            minimum:
              type: integer
              enum:
                - 0
            maximum:
              type: integer
              enum:
                - 15
        bounded:
          type: object
          additionalProperties: false
          required:
            - enabled
            - maximumBlocksInclusive
          properties:
            enabled:
              type: boolean
              enum:
                - true
            maximumBlocksInclusive:
              type: integer
              enum:
                - 10000
        fullRange:
          type: object
          additionalProperties: false
          required:
            - entitled
            - requiredWorkspacePlan
            - coverageContract
            - unsupportedResponse
            - unavailableResponse
            - coverageAvailability
            - selectorCoverage
          properties:
            entitled:
              type: boolean
            requiredWorkspacePlan:
              type: string
              enum:
                - wallet
              description: Required for external callers; an authenticated loopback internal caller is an explicit alternative entitlement.
            coverageContract:
              type: string
              enum:
                - certified_per_selector_position
            unsupportedResponse:
              type: string
              enum:
                - 422_full_range_selector_not_supported
            unavailableResponse:
              type: string
              enum:
                - 503_event_key_index_coverage_unavailable
            coverageAvailability:
              type: string
              enum:
                - available
                - partial
                - unavailable
              description: |
                `available` means selectorCoverage is the complete bounded lookup result and every returned row is currently ready through its observed source high-water. `partial` means the lookup succeeded but selectorCoverage is a bounded prefix or at least one returned row is stale/building/failed. Clients must use row-level throughBlock and freshnessStatus before planning a wide request, and must not infer that an omitted selector lacks coverage when this value is `partial`. `unavailable` means the lookup failed or timed out.
            selectorCoverage:
              type: array
              description: |
                Current selector-position coverage facts for this chain. Clients must only request full-range filtering when every selected topic0 is ready at the same anchor position and the requested numeric range is covered. Before matching, clients must canonicalize each requested topic0 to compact lowercase `0x` form by lowercasing hex digits and removing leading zeroes. Padded or uppercase request spellings are accepted as filters but never appear in `selector`. The server chooses the populated anchor position with the fewest requested values, breaking ties by lower position number. Additional populated later positions are applied to the anchor candidates and do not need separate coverage. A full-range request joins adjacent tier intervals in one repeatable-read snapshot: `finalized` is the retained historical prefix and `head` is the current moving source tail. `head.fromBlock` can increase when promoted rows leave the head table; that does not mean history is absent when the preceding finalized interval is adjacent. `throughBlock` remains each tier's only certified upper bound. openEnded and liveMaintenance describe a maintained projection, not an unbounded serving promise. The server rejects a request unless the exact tier intervals form a gap-free union for the requested numeric range. Compare sourceHighWaterBlock, lagBlocks, and freshnessStatus before planning a wide request; `stale` is an honest coverage gap, while `unavailable` means lifecycle coverage is not ready or that tier has no indexed block watermark. Both receive the typed unavailable response rather than a partial result.
              items:
                $ref: "#/components/schemas/EventKeySelectorCoverage"
              maxItems: 512
    EventKeySelectorCoverage:
      type: object
      additionalProperties: false
      required:
        - selector
        - position
        - sourceTier
        - fromBlock
        - throughBlock
        - openEnded
        - liveMaintenance
        - status
        - verifiedAt
        - sourceHighWaterBlock
        - lagBlocks
        - freshnessStatus
      properties:
        selector:
          type: string
          pattern: ^0x[0-9a-f]{1,64}$
          description: Canonical compact topic0 selector covered by this record.
        position:
          type: integer
          minimum: 1
          maximum: 15
        sourceTier:
          type: string
          enum:
            - finalized
            - head
          description: "`finalized` is the retained historical prefix. `head` is the moving current source tail and is joined to finalized coverage by the server on one repeatable-read snapshot."
        fromBlock:
          type: integer
          minimum: 0
          description: Lowest block in this tier's contiguous certified interval. A finalized fromBlock is its retained-history floor. A head fromBlock is the current moving tail floor and can increase after finalization; it does not by itself signal a history gap.
        throughBlock:
          type: integer
          minimum: 0
          description: Highest block in this tier's contiguous source/index interval verified by the most recent bounded parity certification. It is that tier's hard upper bound for full-range serving; the server requires adjacent finalized/head intervals rather than treating either tier as a separate all-history promise.
        openEnded:
          type: boolean
        liveMaintenance:
          type: boolean
        status:
          type: string
          enum:
            - building
            - ready
            - failed
        verifiedAt:
          type:
            - string
            - "null"
          format: date-time
        sourceHighWaterBlock:
          type:
            - integer
            - "null"
          minimum: 0
          description: Latest indexed block observed for this source tier while capabilities were built. It is informational and may advance before coverage is certified.
        lagBlocks:
          type:
            - integer
            - "null"
          minimum: 0
          description: Non-negative difference between sourceHighWaterBlock and throughBlock. For head this measures the current moving-tail lag, not retained-history coverage. Null only when the source tier has no indexed high-water observation.
        freshnessStatus:
          type: string
          enum:
            - current
            - stale
            - unavailable
          description: "`current` means this tier's certified interval reaches its observed source high-water; `stale` means it does not; `unavailable` means lifecycle coverage is not ready or this tier has no indexed block watermark. Never infer current coverage from openEnded or liveMaintenance alone."
      allOf:
        - if:
            properties:
              sourceTier:
                const: finalized
            required:
              - sourceTier
          then:
            oneOf:
              - properties:
                  openEnded:
                    const: false
                  liveMaintenance:
                    const: false
              - properties:
                  openEnded:
                    const: true
                  liveMaintenance:
                    const: true
        - if:
            properties:
              sourceTier:
                const: head
              status:
                enum:
                  - building
                  - ready
            required:
              - sourceTier
              - status
          then:
            properties:
              openEnded:
                const: true
              liveMaintenance:
                const: true
        - if:
            properties:
              status:
                const: failed
            required:
              - status
          then:
            properties:
              openEnded:
                const: false
              liveMaintenance:
                const: false
        - if:
            properties:
              status:
                const: ready
            required:
              - status
          then:
            properties:
              verifiedAt:
                type: string
                format: date-time
    CapabilitiesRateLimit:
