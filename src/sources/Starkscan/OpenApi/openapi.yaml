  /v1/{chain}/token/{token}/holders:
    get:
      summary: Gap-free token-holder pagination over an immutable indexed generation
      description: |-
        Partner-tier endpoint for token-contract-first holder enumeration. The first page selects a sealed finalized holder generation and v3 cursors retain that generation under concurrent transfers until `snapshot.expiresAt`. The default cursor/retired-generation retention is six hours; the response deadline is authoritative. An unchanged active generation does not expire merely because no transfer arrived. Follow `nextCursor` to null and require one stable snapshot identity plus contiguous ranks through `holderCount` for a complete walk. The generation queue covers every indexed ERC-20 token discovered from finalized fungible balances or ERC-20 metadata, not a top-token allowlist. Results come from Starkscan's indexed ledger, not a request-time transfer scan or RPC enumeration. RPC has no all-holder enumeration method; `balanceOf` is used only for bounded deterministic certification samples at the exact snapshot block hash.

        Partner-tier route backed by materialized serving tables. It is intended for bounded indexed reads and must not run request-time scans or repairs.
      security:
        - StarkscanApiKey: []
      parameters:
        - $ref: "#/components/parameters/ChainParam"
        - name: token
          in: path
          required: true
          schema:
            type: string
          example: "0x04718f5a0fc34cc1af16a1cdee98ffb20c31f5cd61d6ab07201858f4287c938d"
        - name: cursor
          in: query
          description: |
            Optional opaque v3 cursor returned unchanged from `nextCursor` in the previous response. It is scoped to one chain, token, immutable generation, block identity, row anchor, and expiry. Never parse or construct it. Invalid, cross-scope, revoked, or expired cursors return typed `400 invalid_request` restart guidance and never fall back to the first page. A temporarily unavailable holder generation returns retryable `503 service_unavailable` with `Retry-After`; retry the same cursor rather than restarting the walk.
          schema:
            type: string
            maxLength: 512
        - name: limit
          in: query
          description: Page size (clamped to 1..100).
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: |
            One immutable holder-generation page. Ordinary pagination does not set `completeness.truncated`; `nextCursor` alone describes page coverage, while `completeness.exact` and `certification` describe correctness of the full generation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenHolderPage"
              examples:
                immutableGeneration:
                  summary: Certified first page with more immutable rows
                  value:
                    chainId: SN_MAIN
                    tokenAddress: "0x04718f5a0fc34cc1af16a1cdee98ffb20c31f5cd61d6ab07201858f4287c938d"
                    snapshot:
                      asOfBlock: 1212345
                      asOfBlockHash: "0x5d95f8c55a274d08af88f12d4769f89d50fd9a6efcbe3c0e9730f5c8d7c0f21"
                      generationId: 418
