            - maxCalls
            - maxCalldataFelts
            - maxArguments
            - maxStringBytes
          properties:
            maxCalls:
              type: integer
              enum:
                - 1
            maxCalldataFelts:
              type: integer
              enum:
                - 256
            maxArguments:
              type: integer
              enum:
                - 64
            maxStringBytes:
              type: integer
              enum:
                - 4096
        simulation:
          type: object
          additionalProperties: false
          required:
            - status
            - required
          properties:
            status:
              type: string
              enum:
                - not_certified
                - certified
              description: |
                `certified` is required before a Starkscan browser wallet flow may enable signing. `not_certified` keeps the flow fail-closed.
            required:
              type: boolean
              description: |
                Must be true with `status=certified` before a Starkscan browser wallet flow may enable signing.
          oneOf:
            - properties:
                status:
                  const: not_certified
                required:
                  const: false
            - properties:
                status:
                  const: certified
                required:
                  const: true
