      x-starkscan-surface-tier: official-public-api
      x-starkscan-key-tier: read
      tags:
        - Reference
  /v1/{chain}/metrics/wallets:
    get:
      summary: Prepared wallet-provider metrics
      description: Finalized account metrics grouped by known wallet implementation families. The route reads a prepared snapshot only. Priced fungible value is a lower bound over positive finalized balances with non-stale USD quotes; NFTs, DeFi and LP positions, lending collateral, and unpriced assets are excluded. OpenZeppelin-based accounts are an implementation family, not a wallet brand or user identity.
      security:
        - StarkscanApiKey: []
      parameters:
        - $ref: "#/components/parameters/ChainParam"
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Prepared finalized wallet-provider metrics with explicit classification and freshness coverage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletProviderMetricPage"
        "401":
          $ref: "#/components/responses/UnauthorizedText"
        "403":
          $ref: "#/components/responses/ForbiddenText"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-starkscan-audience: public-core
      x-starkscan-certification: beta
      x-starkscan-stability: beta
      x-starkscan-surface-tier: official-public-api
      x-starkscan-key-tier: read
      tags:
        - Reference
  /v1/{chain}/prove:
    post:
      summary: Submit one STRK20 proof request
      description: Invite-only, mainnet-only asynchronous relay for an already formed STRK20 transaction. A mandatory Idempotency-Key absorbs safe client retries before upstream dispatch. Poll the returned jobId; a terminal unknown_delivery status is non-retryable because the prover may have received the request even though no complete response reached Starkscan. The route is absent when the relay is disabled.
      security:
        - StarkscanApiKey: []
      parameters:
        - $ref: "#/components/parameters/ChainParam"
        - name: Idempotency-Key
          in: header
          required: true
          description: Stable unique key for this exact proof request.
          schema:
            type: string
            minLength: 16
            maxLength: 128
          example: starkscan-example-proof-request-0001
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProveRequest"
            examples:
              boundedRequest:
                summary: Bounded source-owned request fixture
                value:
                  block_id: latest
                  transaction:
                    type: INVOKE
                    transaction_hash: "0x054bfd961fb8b156c77ffa0f7882b8fcc1836753c2d3d88435b640d6300c8bd9"
      responses:
        "200":
          description: An idempotent replay returned the original job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProveJobView"
        "202":
          description: A new proof job was accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProveJobView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/UnauthorizedText"
        "403":
          $ref: "#/components/responses/ForbiddenText"
        "404":
          description: Relay disabled or unsupported chain.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          description: Request body exceeds the one-megabyte bound.
          headers:
            X-Request-Id:
              description: Canonical request correlation header for support and tracing.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-starkscan-audience: public-core
      x-starkscan-certification: beta
      x-starkscan-stability: stable
      x-starkscan-surface-tier: operator-issued
      x-starkscan-key-tier: prove
      tags:
        - Reference
  /v1/{chain}/prove/{job_id}:
    get:
      summary: Poll one STRK20 proof job
      description: Returns a workspace-owned proof job. Stop polling when terminal is true. Never automatically resubmit a job whose status is unknown_delivery. The route is absent when the relay is disabled.
      security:
        - StarkscanApiKey: []
      parameters:
        - $ref: "#/components/parameters/ChainParam"
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            pattern: ^prv_[a-z0-9]{24,40}$
          example: prv_0123456789abcdefghijklmn
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Current job state and terminal result or error when available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProveJobView"
        "401":
          $ref: "#/components/responses/UnauthorizedText"
        "403":
          $ref: "#/components/responses/ForbiddenText"
        "404":
          description: Relay disabled, unsupported chain, or job not found for this workspace.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-starkscan-audience: public-core
      x-starkscan-certification: beta
      x-starkscan-stability: stable
      x-starkscan-surface-tier: operator-issued
      x-starkscan-key-tier: prove
      tags:
        - Reference
  /v1/me/api-keys:
    get:
      summary: List self-serve API keys for the authenticated workspace
      description: Returns metadata for the current workspace's self-serve Starkscan API keys. Secrets are never returned by this route. Hosted browser sessions may authenticate this safe read with Better Auth cookies or an explicit bearer session token.
      security:
        - SelfServeSession: []
        - SelfServeSessionCookie: []
        - SelfServeSessionCookieSecure: []
      responses:
        "200":
          description: Self-serve API key list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelfServeApiKeyListResponse"
              examples:
                boundedResponse:
                  summary: Empty bounded API-key list
                  value:
                    items: []
                    truncated: false
        "401":
          $ref: "#/components/responses/UnauthorizedSelfServeSession"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-starkscan-audience: public-core
      x-starkscan-certification: beta
      x-starkscan-stability: stable
      x-starkscan-surface-tier: self-serve
      x-starkscan-key-tier: session
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      tags:
        - Account
    post:
      summary: Issue or rotate the default self-serve API key for the authenticated workspace
      description: "Issues a live API key with read, batch, and write scopes for the current workspace. Write scope is an entitlement only: execution remains gated by forwarding availability, structural payload validation, a dedicated upstream, plan limits and credits, and the global kill switch. If an active default key already exists, the old key is revoked and replaced in the same operation. This mutating route requires `Authorization: Bearer <better_auth_session_token>` and rejects cookie-only calls."
      security:
        - SelfServeSession: []
      responses:
        "200":
          description: Issued self-serve API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelfServeIssueApiKeyResult"
              examples:
                boundedResponse:
                  summary: Example-only API-key issuance response
                  value:
                    action: created
                    plaintextKey: example-only-not-a-real-api-key
                    apiKey:
                      publicId: example_key_01
                      label: Default API key
                      environment: live
                      scopes:
                        - read
                      status: active
                      secretHint: example
                      maskedKey: starkscan_****_example
                      rateLimitPolicy:
                        policyKey: self-serve-read
                        policyDisplayName: Self-serve read
                        lightPerMinute: 120
                        heavyPerMinute: 20
                        burst: 20
                        maxActiveKeys: 2
                      createdAt: '2026-08-10T00:00:00Z'
                      lastUsedAt: null
                      expiresAt: null
                      revokedAt: null
                    revokedPublicIds: []
        "401":
          $ref: "#/components/responses/UnauthorizedSelfServeSession"
        "403":
          $ref: "#/components/responses/ForbiddenSelfServeMutation"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-starkscan-audience: public-core
      x-starkscan-certification: beta
      x-starkscan-stability: stable
      x-starkscan-surface-tier: self-serve
      x-starkscan-key-tier: session
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      tags:
        - Account
  /v1/me/api-keys/{public_id}:
    delete:
      summary: Revoke one self-serve API key for the authenticated workspace
      description: "Revokes the selected self-serve API key and returns its final metadata snapshot. This mutating route requires `Authorization: Bearer <better_auth_session_token>` and rejects cookie-only calls."
      security:
        - SelfServeSession: []
      parameters:
        - name: public_id
          in: path
          required: true
          schema:
            type: string
          example: example_key_01
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Revoked self-serve API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelfServeApiKeyDeleteResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedSelfServeSession"
        "403":
          $ref: "#/components/responses/ForbiddenSelfServeMutation"
        "404":
          description: Self-serve API key not found
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-starkscan-audience: public-core
      x-starkscan-certification: beta
      x-starkscan-stability: stable
      x-starkscan-surface-tier: self-serve
      x-starkscan-key-tier: session
      tags:
        - Account
  /v1/me/redeem-code:
    post:
      summary: Redeem a single-use workspace-plan access code
      description: "Atomically consumes one labeled, unexpired and unrevoked access code and applies its plan to the authenticated workspace. Codes are single-use; missing, expired, revoked and already-used values share the same error. This mutating route requires `Authorization: Bearer <better_auth_session_token>` and rejects cookie-only calls."
      security:
        - SelfServeSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelfServePartnerAccessCodeRequest"
            examples:
              documentationOnlyCode:
                summary: Documentation-only single-use access-code shape
                value:
                  code: example-only-access-code
      responses:
        "200":
          description: Access code consumed and workspace plan updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelfServePartnerAccessCodeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/UnauthorizedSelfServeSession"
        "403":
          $ref: "#/components/responses/ForbiddenSelfServeMutation"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-starkscan-audience: public-core
      x-starkscan-certification: beta
      x-starkscan-stability: stable
      x-starkscan-surface-tier: self-serve
      x-starkscan-key-tier: session
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      tags:
        - Account
  /v1/me/usage:
    get:
      summary: Load recent self-serve API usage for the authenticated workspace
      description: Returns a recent usage window, per-key aggregates, recent requests, and recent failures for the current self-serve workspace. Hosted browser sessions may authenticate this safe read with Better Auth cookies or an explicit bearer session token.
      security:
        - SelfServeSession: []
        - SelfServeSessionCookie: []
        - SelfServeSessionCookieSecure: []
      responses:
        "200":
          description: Self-serve usage snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelfServeUsageSnapshot"
              examples:
                boundedResponse:
                  summary: Empty bounded usage window
                  value:
                    windowStart: '2026-08-10T00:00:00Z'
                    windowEnd: '2026-08-10T01:00:00Z'
                    totalRequests: 0
                    totalFailures: 0
                    perKey: []
                    perKeyTruncated: false
                    recentRequests: []
                    recentRequestsTruncated: false
                    recentFailures: []
                    recentFailuresTruncated: false
        "401":
          $ref: "#/components/responses/UnauthorizedSelfServeSession"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-starkscan-audience: public-core
      x-starkscan-certification: beta
      x-starkscan-stability: stable
      x-starkscan-surface-tier: self-serve
      x-starkscan-key-tier: session
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      tags:
        - Account
  /v1/{chain}/search:
    get:
      summary: Universal search
      description: Identifier-only search for recognized transaction hashes, block references, and addresses. It is not ticker, symbol, or free-text search; the response has separate `blocks`, `transactions`, and `addresses` arrays, not a generic `results` field.
      security:
        - StarkscanApiKey: []
      parameters:
        - $ref: "#/components/parameters/ChainParam"
        - name: q
          in: query
          required: true
          description: |
            Required exact or prefix identifier query. Missing or empty values return 400. Exact hash/address-style queries resolve first match in this order: transaction hash -> address -> block hash (single category returned). Prefix address matching reads address-activity tables only; addresses that appear exclusively in token-transfer activity remain accessible via `/v1/{chain}/address/{address}` but are not returned by `/search`.
          schema:
            type: string
          example: "0x054bfd961fb8b156c77ffa0f7882b8fcc1836753c2d3d88435b640d6300c8bd9"
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchView"
        "401":
          $ref: "#/components/responses/UnauthorizedText"
        "403":
          $ref: "#/components/responses/ForbiddenText"
        "410":
          $ref: "#/components/responses/HistoryExpired"
        "429":
          $ref: "#/components/responses/RateLimited"
      x-starkscan-audience: public-core
      x-starkscan-certification: beta
      x-starkscan-stability: stable
      x-starkscan-surface-tier: official-public-api
      x-starkscan-key-tier: read
      tags:
        - Search
components:
  headers:
    PrivacyPoolBetaStability:
      description: Machine-readable lifecycle marker for the beta Privacy Pool public route.
      required: true
      schema:
        type: string
        const: beta
    RequestId:
      description: Canonical request correlation header for support and tracing.
      schema:
        type: string
    WwwAuthenticate:
      description: Authentication or scope hint when the request is rejected.
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before retrying this route class.
      schema:
        type: integer
        format: int64
    StarkscanRouteClass:
      description: Route budget class for class-specific backoff.
      schema:
        type: string
        enum:
          - light
          - heavy
          - batch
    RateLimitLimit:
      description: Maximum request budget for the current route-class window.
      schema:
        type: integer
        format: int64
    RateLimitRemaining:
      description: Remaining request budget for the current route-class window.
      schema:
        type: integer
        format: int64
    RateLimitPolicy:
      description: Opaque rate-limit policy identifier for the current route class.
      schema:
        type: string
  securitySchemes:
    StarkscanApiKey:
      type: apiKey
      in: header
      name: X-Starkscan-Api-Key
      description: External Starkscan API key header. Required access tier and scope are defined per operation.
    SelfServeSession:
      type: http
      scheme: bearer
      bearerFormat: Better Auth session token
      description: Session token for authenticated self-serve workspace routes. Hosted browser safe reads can also use Better Auth session cookies, but mutating /v1/me/* routes require an explicit bearer token.
    SelfServeSessionCookie:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: Better Auth session cookie accepted for hosted same-origin safe reads on /v1/me/*.
    SelfServeSessionCookieSecure:
      type: apiKey
      in: cookie
      name: __Secure-better-auth.session_token
      description: Secure Better Auth session cookie accepted for hosted same-origin safe reads on /v1/me/*.
  parameters:
    ChainParam:
      name: chain
      in: path
      required: true
      schema:
        type: string
      example: SN_MAIN
    RequestIdHeader:
      name: X-Request-Id
      in: header
      required: false
      description: Optional caller-supplied correlation ID echoed back in the response.
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid request shape, path parameter, query parameter, or body.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ForbiddenSelfServeMutation:
      description: Cookie-authenticated mutations are not allowed on self-serve routes.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        WWW-Authenticate:
          $ref: "#/components/headers/WwwAuthenticate"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnauthorizedText:
      description: Missing or invalid Starkscan credential.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        WWW-Authenticate:
          $ref: "#/components/headers/WwwAuthenticate"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnauthorizedSelfServeSession:
      description: Missing, invalid, or expired self-serve session.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        WWW-Authenticate:
          $ref: "#/components/headers/WwwAuthenticate"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Rate limit hit for the current route class.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
        X-Starkscan-Route-Class:
          $ref: "#/components/headers/StarkscanRouteClass"
        x-ratelimit-limit:
          $ref: "#/components/headers/RateLimitLimit"
        x-ratelimit-remaining:
          $ref: "#/components/headers/RateLimitRemaining"
        x-ratelimit-policy:
          $ref: "#/components/headers/RateLimitPolicy"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    HistoryExpired:
      description: |
        The request explicitly targets Sepolia indexed history below the published rolling-history floor. Current state and preserved lifecycle facts remain available; advance to `oldestAvailableBlock` or begin a new cursor traversal.
      headers:
        X-Request-Id:
          description: Canonical request correlation header for support and tracing.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HistoryExpiredErrorResponse"
    ServiceUnavailable:
      description: The route is temporarily unavailable.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PrivacyPoolServiceUnavailable:
      description: The Privacy Pool route is temporarily unavailable.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        X-Starkscan-Route-Stability:
          $ref: "#/components/headers/PrivacyPoolBetaStability"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    IndexingFreshnessDegraded:
      description: Indexing is stale or required freshness evidence is unavailable or inconsistent.
      headers:
        X-Request-Id:
          description: Canonical request correlation header for support and tracing.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IndexingFreshnessHealthView"
    L1FinalityQuorumDegraded:
      description: Required L1 quorum evidence is missing, stale, failed, degraded, diverged, or inconsistent.
      headers:
        X-Request-Id:
          description: Canonical request correlation header for support and tracing.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/L1FinalityQuorumHealthView"
    L1FinalityFreshnessDegraded:
      description: The materialized L1 finality watermark is missing, stale, or inconsistent.
      headers:
        X-Request-Id:
          description: Canonical request correlation header for support and tracing.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/L1FinalityFreshnessHealthView"
    PrivacyPoolBadRequest:
      description: Invalid Privacy Pool path, query parameter, or cursor.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        X-Starkscan-Route-Stability:
          $ref: "#/components/headers/PrivacyPoolBetaStability"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ForbiddenText:
      description: Valid Starkscan credential lacks the required scope.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        WWW-Authenticate:
          $ref: "#/components/headers/WwwAuthenticate"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The requested route or resource was not found.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The request conflicts with the current resource state.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    EventKeyFeltFilter:
      type: array
      maxItems: 128
      items:
        type: string
        pattern: ^0[xX][0-9a-fA-F]{1,64}$
    SequentialEventKeyCompatibilityFilter:
      type: array
      maxItems: 15
      items:
        type: string
        pattern: ^0[xX][0-9a-fA-F]{1,64}$
    StakingRatio:
      type: object
      additionalProperties: false
      required:
        - numeratorRaw
        - denominatorRaw
      properties:
        numeratorRaw:
          type: string
          pattern: ^[0-9]+$
        denominatorRaw:
          type: string
          pattern: ^[1-9][0-9]*$
    StakingCoverage:
      type: object
      additionalProperties: false
      required:
        - status
        - reasonCode
        - finalizedOnly
        - materializedThroughBlock
        - materializedThroughHash
        - sourceLatestFinalizedBlock
        - lagBlocks
        - activityHistoryTruncated
        - gapIntervals
        - outstandingMaterializationIntervals
        - metricDefinitionVersion
        - lastSuccessfulRunAtIso
      properties:
        status:
          type: string
          enum:
            - prepared
            - catching_up
            - unavailable
        reasonCode:
          type: string
        finalizedOnly:
          type: boolean
          const: true
        materializedThroughBlock:
          type:
            - integer
            - "null"
          format: int64
          minimum: 0
        materializedThroughHash:
          type:
            - string
            - "null"
        sourceLatestFinalizedBlock:
          type:
            - integer
            - "null"
          format: int64
          minimum: 0
        lagBlocks:
          type:
            - integer
            - "null"
          format: int64
          minimum: 0
        activityHistoryTruncated:
          type: boolean
          description: True when the prepared activity feed retains only its newest bounded window; full finalized history remains in the immutable source ledger.
        gapIntervals:
          type: array
          items:
            $ref: "#/components/schemas/StakingCoverageGap"
        outstandingMaterializationIntervals:
          type: array
          items:
            $ref: "#/components/schemas/StakingCoverageGap"
        metricDefinitionVersion:
          type:
            - string
            - "null"
