  title: Cross-Chain Transfer Protocol (CCTP)
  description: |
    Circle's Cross-Chain Transfer Protocol enables you to build seamless user experiences for sending and transacting USDC natively across blockchains.

    CCTP endpoints enable advanced capabilities such as fetching attestations for faster-than-finality burn events, verifying public keys across versions, accessing transaction details, querying Fast Transfer allowances and fees, and initiating re-attestation processes.
